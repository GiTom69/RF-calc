<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RF Calculator (offline)</title>
<style>
:root, [data-theme="dark"] {
  --bg: #0e1318; --panel: #161c24; --panel2: #1c2430; --text: #e4eaf1; --muted: #8a97a6;
  --border: #283240; --input: #0d1218; --accent: #4aa3ff; --accent-t: #9ccbff;
  --calc-bg: #12263d; --calc-bd: #3277c0; --err: #ff6b6b; --err-bg: #3a1a1e; --warn: #ffc65c;
  --good: #4cd18a; --shadow: 0 1px 2px rgba(0,0,0,.4);
  --axis: #3c4859; --ink-on: #0b0b0b;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --h0: #0d366b; --h1: #104281; --h2: #184f95; --h3: #1c5cab; --h4: #256abf;
  --h5: #2a78d6; --h6: #3987e5; --h7: #5598e7; --h8: #6da7ec; --h9: #86b6ef;
  --ht0: #fff; --ht1: #fff; --ht2: #fff; --ht3: #fff; --ht4: #fff; --ht5: #000; /* white on #2a78d6 is 4.42:1; black is 4.76:1 */
  --ht6: #0b0b0b; --ht7: #0b0b0b; --ht8: #0b0b0b; --ht9: #0b0b0b;
  --seg-ink-1: #0b0b0b;
}
[data-theme="light"] {
  --bg: #f2f4f7; --panel: #ffffff; --panel2: #f6f8fa; --text: #1a2330; --muted: #5d6a7a;
  --border: #d6dce4; --input: #ffffff; --accent: #0a66c2; --accent-t: #0a4f96;
  --calc-bg: #e6f0fc; --calc-bd: #5c9be0; --err: #c62828; --err-bg: #fdecec; --warn: #a86400;
  --good: #1b8a4c; --shadow: 0 1px 2px rgba(0,0,0,.08);
  --axis: #b9c1cc; --ink-on: #0b0b0b;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --h0: #cde2fb; --h1: #b7d3f6; --h2: #86b6ef; --h3: #6da7ec; --h4: #3987e5;
  --h5: #2a78d6; --h6: #256abf; --h7: #1c5cab; --h8: #184f95; --h9: #0d366b;
  --ht0: #0b0b0b; --ht1: #0b0b0b; --ht2: #0b0b0b; --ht3: #0b0b0b; --ht4: #0b0b0b;
  --ht5: #000; --ht6: #fff; --ht7: #fff; --ht8: #fff; --ht9: #fff;
  --seg-ink-1: #000; /* on --series-1 #2a78d6: black 4.76:1 (white is only 4.42:1) */
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
sub, sup { font-size: 0.72em; line-height: 0; }
button, input, select { font: inherit; color: inherit; }

/* ---------------------------------------------------------------- header */
header {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
}
header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
header h1 span { color: var(--accent); }
#search {
  flex: 1; max-width: 420px; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--input);
}
.legend { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; margin-left: auto; }
.chip { display: inline-block; width: 26px; height: 16px; border-radius: 4px; vertical-align: -3px; margin-right: 4px;
  border: 1px solid var(--border); background: var(--input); font-size: 11px; text-align: center; line-height: 14px; }
.chip.c { background: var(--calc-bg); border-color: var(--calc-bd); color: var(--accent-t); font-weight: 700; }
.chip.e { border-style: dashed; }
#menu { display: none; }

/* ---------------------------------------------------------------- layout */
.layout { display: flex; align-items: flex-start; }
nav#nav {
  position: sticky; top: 53px; width: 236px; flex: 0 0 236px; height: calc(100vh - 53px); overflow-y: auto;
  padding: 10px 8px; border-right: 1px solid var(--border); background: var(--panel);
}
.navbtn {
  display: flex; justify-content: space-between; width: 100%; text-align: left; padding: 8px 10px; margin: 1px 0;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
}
.navbtn:hover { background: var(--panel2); }
.navbtn.active { background: var(--calc-bg); color: var(--accent-t); font-weight: 600; }
.navbtn .count { color: var(--muted); font-size: 12px; }
.navfoot { margin-top: 14px; padding: 10px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
.navfoot p { margin: 0 0 8px; }
main { flex: 1; min-width: 0; padding: 16px 18px 40px; }
#cat-title { margin: 2px 0 14px; font-size: 20px; }
#cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 16px; align-items: start; }

/* ----------------------------------------------------------------- cards */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card[hidden] { display: none; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 10px 14px; border-bottom: 1px solid var(--border); }
.card-head h3 { margin: 0; font-size: 15px; }
.card-btns { display: flex; gap: 6px; }
.card-body { padding: 10px 14px 14px; }
.desc { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel2); cursor: pointer; font-size: 12px; }
.btn:hover { border-color: var(--accent); }
.btn.small { padding: 1px 7px; }
.btnrow { display: flex; gap: 8px; margin: 8px 0; }

.cfg { margin-bottom: 8px; }
.cfgrow { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.cfgrow > span { flex: 0 0 auto; min-width: 120px; color: var(--muted); font-size: 13px; }
.cfgrow select { flex: 1; min-width: 0; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--input); }

/* ---------------------------------------------------------------- fields */
.fields { display: flex; flex-direction: column; gap: 4px; }
.frow { display: grid; grid-template-columns: minmax(0, 1fr) 168px 76px; gap: 8px; align-items: center; }
.flabel { font-size: 13px; overflow-wrap: anywhere; }
.fin { position: relative; }
.fin input {
  width: 100%; padding: 5px 26px 5px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--input); font-variant-numeric: tabular-nums; text-align: right;
}
.fin input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.frow.calc .fin input { background: var(--calc-bg); border-color: var(--calc-bd); color: var(--accent-t); font-weight: 600; }
.frow.empty .fin input { border-style: dashed; }
.frow.err .fin input { border-color: var(--err); background: var(--err-bg); }
.fin input.bad { border-color: var(--err) !important; outline-color: var(--err); }
.badge { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: 13px; color: var(--accent-t); pointer-events: none; }
.frow.err .badge { color: var(--err); }
.frow.free .flabel { color: var(--muted); }
.unit, .sym { font-size: 12px; }
select.unit { width: 100%; padding: 4px 2px; border-radius: 6px; border: 1px solid var(--border); background: var(--input); }
.sym { color: var(--muted); padding-left: 3px; }
.fsep { margin: 8px 0 2px; padding-top: 6px; border-top: 1px dashed var(--border); color: var(--muted); font-size: 12px; }

.msg { margin: 8px 0 0; font-size: 13px; min-height: 0; }
.msg:empty { display: none; }
.msg.info { color: var(--muted); }
.msg.err { color: var(--err); }
.msg.warn { color: var(--warn); }

.outputs { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.orow { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; font-size: 13px; }
.olabel { color: var(--muted); }
.oval { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.note { margin-top: 10px; padding: 8px 10px; background: var(--panel2); border-radius: 6px; color: var(--muted); font-size: 12px; }

/* ---------------------------------------------------------------- tables */
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.grid { width: 100%; font-size: 13px; }
.grid th, .grid td { padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.grid th { color: var(--muted); font-weight: 600; background: var(--panel2); }
.grid.mono td { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.grid.edit input { width: 100%; min-width: 60px; padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--input); }
.kv { width: 100%; font-size: 13px; }
.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: 3px 12px 3px 0; width: 52%; }
.kv td { padding: 3px 0; font-weight: 600; }
.sect { margin-top: 14px; }
.sect h4 { margin: 0 0 6px; font-size: 13px; color: var(--accent-t); }
.convs { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 0 20px; }
.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
.cols .frow { grid-template-columns: minmax(0, 1fr) 140px 70px; }
.muted { color: var(--muted); font-weight: 400; }
.good { color: var(--good); font-weight: 700; }
.bad-t { color: var(--err); font-weight: 700; }
.nowrap { white-space: nowrap; }
.sout { overflow-x: auto; }

/* matrix input */
.mwrap { margin-top: 8px; overflow-x: auto; }
.mtx th { color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px; }
.mtx td { padding: 3px; }
.mcell { display: flex; flex-direction: column; gap: 2px; padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); }
.sname { font-size: 11px; font-weight: 700; color: var(--accent-t); }
.mpair { display: flex; align-items: center; gap: 4px; }
.mpair input { width: 92px; padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--input); text-align: right; }
.mpair input.bad { border-color: var(--err); }
.mu { font-size: 11px; color: var(--muted); width: 22px; }

/* ---------------------------------------------------------------- charts */
.viz-row { display: flex; flex-wrap: wrap; gap: 18px 28px; margin: 12px 0 4px; align-items: flex-start; }
.viz-host { margin-top: 12px; }
.viz { margin: 0; min-width: 0; }
.viz-title { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.viz-note { margin-top: 6px; font-size: 11px; color: var(--muted); max-width: 300px; }
.viz-svg { display: block; overflow: visible; max-width: 100%; height: auto; }
.viz-grid { fill: none; stroke: var(--border); stroke-width: 1; }
.viz-axis { fill: none; stroke: var(--axis); stroke-width: 1; }
.viz-axis-t { fill: var(--muted); font-size: 10px; }
.viz-axis-t.sm { font-size: 9px; }
.viz-dlabel { fill: var(--text); font-size: 11px; font-weight: 600; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.viz-dot { stroke: var(--panel); stroke-width: 2; }
.viz-dot.off { fill: var(--panel); stroke-width: 2; }
.viz-offarrow { stroke: var(--panel); stroke-width: 1; }
.viz-vec { stroke-width: 2; stroke-linecap: round; }
.viz-hitarea { fill: transparent; cursor: default; }
.viz-hit:focus { outline: none; }
.viz-hitarea:hover, .viz-hitarea:focus { fill: var(--text); fill-opacity: .08; }
g.viz-hit:hover rect, g.viz-hit:focus rect { filter: brightness(1.15); stroke: var(--text); stroke-width: 1; }
.heat-t { font-size: 11px; font-weight: 600; pointer-events: none; }
.heat-v { font-weight: 400; }
.viz-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 12px; max-width: 300px; }
.viz-row .viz-legend { flex-direction: column; }
.viz-li { display: inline-flex; align-items: center; gap: 6px; }
.viz-sw { display: inline-block; width: 10px; height: 10px; flex: 0 0 auto; }
.viz-sw.rect { border-radius: 2px; }
.viz-sw.dot { border-radius: 50%; }
.viz-li-name { color: var(--text); font-weight: 600; }
.viz-li-val { color: var(--muted); font-variant-numeric: tabular-nums; }
.viz-host .viz-legend { max-width: none; }
.viz-bar { display: flex; gap: 2px; height: 24px; }
.viz-seg { min-width: 0; display: flex; align-items: center; justify-content: center; }
.viz-seg.end { border-radius: 0 4px 4px 0; }
.viz-seg:hover, .viz-seg:focus { filter: brightness(1.12); outline: none; }
.viz-seg-label { font-size: 11px; font-weight: 600; white-space: nowrap; color: var(--ink-on); pointer-events: none; }
.viz-seg-label.ink-1 { color: var(--seg-ink-1); }
.viz-scale { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 3px; }
.viz-ramp { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); margin-top: 6px; }
.viz-ramp-bar { display: inline-flex; gap: 1px; }
.heat-sw { display: inline-block; width: 14px; height: 8px; }
.viz-tip { position: fixed; z-index: 100; display: none; pointer-events: none; padding: 6px 9px; border-radius: 6px;
  background: var(--panel); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: 12px; }
.viz-tip-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.viz-tip-row strong { font-variant-numeric: tabular-nums; }
.viz-tip-label { color: var(--muted); }
.viz-key { display: inline-block; width: 10px; height: 2px; border-radius: 1px; }

.heat.h0 { fill: var(--h0); } .heat-sw.h0 { background: var(--h0); } .heat-t.h0 { fill: var(--ht0); }
.heat.h1 { fill: var(--h1); } .heat-sw.h1 { background: var(--h1); } .heat-t.h1 { fill: var(--ht1); }
.heat.h2 { fill: var(--h2); } .heat-sw.h2 { background: var(--h2); } .heat-t.h2 { fill: var(--ht2); }
.heat.h3 { fill: var(--h3); } .heat-sw.h3 { background: var(--h3); } .heat-t.h3 { fill: var(--ht3); }
.heat.h4 { fill: var(--h4); } .heat-sw.h4 { background: var(--h4); } .heat-t.h4 { fill: var(--ht4); }
.heat.h5 { fill: var(--h5); } .heat-sw.h5 { background: var(--h5); } .heat-t.h5 { fill: var(--ht5); }
.heat.h6 { fill: var(--h6); } .heat-sw.h6 { background: var(--h6); } .heat-t.h6 { fill: var(--ht6); }
.heat.h7 { fill: var(--h7); } .heat-sw.h7 { background: var(--h7); } .heat-t.h7 { fill: var(--ht7); }
.heat.h8 { fill: var(--h8); } .heat-sw.h8 { background: var(--h8); } .heat-t.h8 { fill: var(--ht8); }
.heat.h9 { fill: var(--h9); } .heat-sw.h9 { background: var(--h9); } .heat-t.h9 { fill: var(--ht9); }

/* ---------------------------------------------------------------- mobile */
@media (max-width: 900px) {
  #menu { display: inline-block; }
  .legend { display: none; }
  nav#nav { position: fixed; left: 0; top: 53px; z-index: 30; transform: translateX(-100%); transition: transform .2s; }
  body.nav-open nav#nav { transform: none; }
  #cards { grid-template-columns: 1fr; }
  .cols { grid-template-columns: 1fr; }
  main { padding: 12px; }
}
@media (max-width: 520px) {
  .frow, .cols .frow { grid-template-columns: minmax(0, 1fr) 128px 64px; }
}
@media print {
  header, nav#nav { display: none; }
  .card { break-inside: avoid; }
}

/* line chart */
.viz-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.viz-line.muted { stroke: var(--muted); stroke-width: 1.25; opacity: .45; }
.viz-cross { stroke: var(--axis); stroke-width: 1; pointer-events: none; }
.viz-vline { stroke: var(--axis); stroke-width: 1; }
.viz-overlay { fill: transparent; }
.viz-overlay:focus { outline: none; stroke: var(--accent); stroke-width: 1; }
.viz-dlabel.sm { font-size: 10px; font-weight: 500; }
.viz-sw.line { width: 14px; height: 2px; border-radius: 1px; }

/* ---- batch 1: BER chart, POI card ---- */
.b1-berviz .viz-svg, .b1-poiviz .viz-svg { width: 100%; height: auto; max-width: 560px; }
.b1-berviz .viz-row { margin-top: 0; }
.b1-reqtable td, .b1-reqtable th { white-space: nowrap; }
.b1-berviz .sect { overflow-x: auto; }
.b1-wins { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; margin: 10px 0; align-items: start; }
.b1-win { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--panel2); min-width: 0; }
.b1-winhead { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.b1-winno { font-weight: 700; color: var(--accent-t); font-size: 12px; white-space: nowrap; }
.b1-winhead input, .b1-winhead select, .b1-addwin select {
  min-width: 0; padding: 3px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--input); }
.b1-winhead input { flex: 1 1 80px; }
.b1-winhead select { flex: 1 1 150px; }
.b1-win .frow { grid-template-columns: minmax(0, 1fr) 112px 62px; }
.b1-wininfo { margin-top: 6px; font-size: 12px; color: var(--muted); }
.b1-warn { color: var(--warn); margin-top: 2px; }
.b1-addwin { display: flex; gap: 8px; align-items: center; align-self: center; }
.b1-addwin select { flex: 1 1 auto; }
.b1-addwin .btn { white-space: nowrap; }
.b1-warns .msg { margin-top: 4px; }

/* batch 2 */
.b2-chart { margin-top: 12px; max-width: 100%; overflow: hidden; }
.b2-chart svg.viz-svg { max-width: 100%; height: auto; }
.b2-tbl tr.b2-want td { background: var(--calc-bg); }
.b2-tbl tr.b2-hit td { color: var(--warn); }
.b2-pn input { min-width: 90px; }

/* batch 3 */
.b3-blocks td { vertical-align: top; }
.b3-blocks select.b3-type { padding: 3px 4px; border-radius: 5px; border: 1px solid var(--border); background: var(--input); max-width: 220px; }
.b3-params { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.b3-param { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
.b3-param input { width: 84px; min-width: 0; text-align: right; }
.b3-plabel { color: var(--muted); white-space: nowrap; }
.b3-punit { color: var(--muted); white-space: nowrap; }

</style>
</head>
<body>
<header>
  <button id="menu" class="btn" aria-label="Menu">☰</button>
  <h1><span>RF</span> Calculator</h1>
  <input id="search" type="search" placeholder="Search calculators… (press /)" autocomplete="off">
  <div class="legend">
    <span><span class="chip"></span>your input</span>
    <span><span class="chip c">=</span>calculated</span>
    <span><span class="chip e"></span>blank</span>
  </div>
  <button id="theme" class="btn">☀ Light</button>
  <button id="resetall" class="btn" title="Reset every calculator">Reset all</button>
</header>
<div class="layout">
  <nav id="nav">
    <!-- category buttons are inserted here -->
  </nav>
  <main>
    <h2 id="cat-title"></h2>
    <div id="cards"></div>
  </main>
</div>
<script>
'use strict';
// ============================================================================
// core.js - constants, number parsing/formatting, complex math, root finding
// and the "last unknown is calculated" solver engine. No DOM access here.
// ============================================================================

const C0 = 299792458;            // speed of light, m/s
const KB = 1.380649e-23;         // Boltzmann constant, J/K
const MU0 = 1.25663706212e-6;    // vacuum permeability, H/m
const EPS0 = 8.8541878128e-12;   // vacuum permittivity, F/m
const ETA0 = 376.730313668;      // free-space impedance, ohm
const R_EARTH = 6371e3;          // mean earth radius, m
const PI = Math.PI;
const log10 = Math.log10;
const sqrt = Math.sqrt;
const DB_NEPER = 20 / Math.LN10; // 8.6859 dB per neper

// ---------------------------------------------------------------- units ----
const UNITS = {
  Hz:   [['Hz', 1], ['kHz', 1e3], ['MHz', 1e6], ['GHz', 1e9], ['THz', 1e12]],
  m:    [['nm', 1e-9], ['µm', 1e-6], ['mm', 1e-3], ['cm', 1e-2], ['m', 1], ['km', 1e3],
         ['mil', 25.4e-6], ['in', 0.0254], ['ft', 0.3048], ['mi', 1609.344], ['nmi', 1852]],
  ohm:  [['mΩ', 1e-3], ['Ω', 1], ['kΩ', 1e3], ['MΩ', 1e6]],
  H:    [['pH', 1e-12], ['nH', 1e-9], ['µH', 1e-6], ['mH', 1e-3], ['H', 1]],
  F:    [['fF', 1e-15], ['pF', 1e-12], ['nF', 1e-9], ['µF', 1e-6], ['mF', 1e-3], ['F', 1]],

// Nearest standard values below/above x and the closest one, in the given series.
function nearestE(x, series) {
  if (!(x > 0) || !isFinite(x)) return null;
  const base = E_SERIES[series];
  const digits = base[0] >= 100 ? 2 : 1;
  const dec = Math.floor(log10(x)) - digits;
  const cands = [];
  for (const d of [dec - 1, dec, dec + 1]) for (const b of base) cands.push(Number((b * Math.pow(10, d)).toPrecision(3)));
  cands.sort((a, b) => a - b);
  let lo = cands[0], hi = cands[cands.length - 1];
  for (const c of cands) { if (c <= x * (1 + 1e-12)) lo = c; }
  for (let i = cands.length - 1; i >= 0; i--) { if (cands[i] >= x * (1 - 1e-12)) hi = cands[i]; }
  const best = Math.abs(Math.log(lo / x)) <= Math.abs(Math.log(hi / x)) ? lo : hi;
  return { lo: lo, hi: hi, best: best, err: (best - x) / x * 100 };
}

function s2Analyze(S, z0, zs, zl) {
  const S11 = S[0][0], S12 = S[0][1], S21 = S[1][0], S22 = S[1][1];
  const a11 = cabs(S11), a12 = cabs(S12), a21 = cabs(S21), a22 = cabs(S22);
  const delta = csub(cmul(S11, S22), cmul(S12, S21));
  const ad = cabs(delta);
  const p = a12 * a21;
  // N = 1 − |S11|² − |S22|² + |Δ|² = 2K·|S12S21|, in the algebraically identical form
  // (1 − |S11|²)(1 − |S22|²) + |S12S21|² − 2·Re(S11·S22·(S12·S21)*), which avoids the
  // O(1) cancellation when |S11|, |S22| ≈ 1 and S21 is tiny (e.g. a 1 µΩ shunt).
  const d11 = (1 - a11) * (1 + a11), d22 = (1 - a22) * (1 + a22);
  const xr = cmul(cmul(S11, S22), cconj(cmul(S12, S21))).re;
  const N = d11 * d22 + p * p - 2 * xr;

  const tolN = 8 * Number.EPSILON * (Math.abs(d22) * Math.pow(1 + a11, 2) + Math.abs(d11) * Math.pow(1 + a22, 2) + Math.abs(d11 * d22) + p * p + 2 * Math.abs(xr));
  const K = N / (2 * p);
  const mu = d11 / (cabs(csub(S22, cmul(delta, cconj(S11)))) + p);
  const mu2 = d22 / (cabs(csub(S11, cmul(delta, cconj(S22)))) + p);

  const S1221 = cmul(S12, S21);
  const gin = cadd(S11, cdiv(cmul(S1221, gl), csub(CONE, cmul(S22, gl))));
  const gout = cadd(S22, cdiv(cmul(S1221, gs), csub(CONE, cmul(S11, gs))));
  const den = csub(cmul(csub(CONE, cmul(S11, gs)), csub(CONE, cmul(S22, gl))), cmul(S1221, cmul(gs, gl)));
  const GT = (1 - cabs2(gs)) * a21 * a21 * (1 - cabs2(gl)) / cabs2(den);
  const GP = a21 * a21 * (1 - cabs2(gl)) / ((1 - cabs2(gin)) * cabs2(csub(CONE, cmul(S22, gl))));
  const GA = a21 * a21 * (1 - cabs2(gs)) / (cabs2(csub(CONE, cmul(S11, gs))) * (1 - cabs2(gout)));

  const uncond = K > 1 && ad < 1;

  // The second form has no ∞−∞ for a unilateral device (S12 = 0: G_TU,max). MAG only exists
  // for an unconditionally stable device, K ≥ 1 and |Δ| < 1 (Pozar 12.3); the lossless boundary
  // (K = 1, |Δ| = 1, e.g. a through line) is included within the round-off bound tolN (MAG = MSG).
  const MAG0 = (ad < 1 + 1e-9 && N > 0 && N >= 2 * p - tolN) ? 2 * a21 * a21 / (N + sqrt(Math.max(0, N * N - 4 * p * p))) : NaN;

  // the unit circle and only round-off decides which side)
  if (K > 1 && !onK1) {

    const C1 = csub(S11, cmul(delta, cconj(S22)));
    const B2 = 1 + a22 * a22 - a11 * a11 - ad * ad;
    const C2 = csub(S22, cmul(delta, cconj(S11)));

      const r = sqrt(Math.max(0, B * B - 4 * cabs2(C)));

      const g = cscale(cconj(C), 2 / (B + Math.sign(B) * r));

    gs: gs, gl: gl, gin: gin, gout: gout, zin: gammaToZ(gin, z0), zout: gammaToZ(gout, z0),

  const A = cdiv(cadd(cmul(cadd(CONE, S11), csub(CONE, S22)), S1221), d);
  const B = cscale(cdiv(csub(cmul(cadd(CONE, S11), cadd(CONE, S22)), S1221), d), z0);
  const C = cscale(cdiv(csub(cmul(csub(CONE, S11), csub(CONE, S22)), S1221), d), 1 / z0);
  const D = cdiv(cadd(cmul(csub(CONE, S11), cadd(CONE, S22)), S1221), d);
  return [[A, B], [C, D]];
}
// det (optional) = AD − BC known exactly, e.g. the product of the block determinants of a
// cascade (1 for every reciprocal block); computing AD − BC from a deep cascade's huge
// entries cancels catastrophically and corrupts S12.
function abcdToS(M, z0, det) {
  const A = M[0][0], B = cscale(M[0][1], 1 / z0), C = cscale(M[1][0], z0), D = M[1][1];
  const den = cadd(cadd(A, B), cadd(C, D));
  const AD_BC = det || csub(cmul(A, D), cmul(B, C));
  return [
    [cdiv(csub(cadd(A, B), cadd(C, D)), den), cdiv(cscale(AD_BC, 2), den)],
    [cdiv(cx(2), den), cdiv(cadd(csub(B, A), csub(D, C)), den)],
  ];
}
// Transfer (T) parameters, convention [b1; a1] = T [a2; b2], so T_total = T_A · T_B
function sToT(S) {
  const S11 = S[0][0], S12 = S[0][1], S21 = S[1][0], S22 = S[1][1];
  const delta = csub(cmul(S11, S22), cmul(S12, S21));
  return [[cneg(cdiv(delta, S21)), cdiv(S11, S21)], [cneg(cdiv(S22, S21)), cdiv(CONE, S21)]];
}
// n-port conversions with equal real reference impedance at every port
function sToZ(S, z0) {
  const I = mEye(S.length);
  const inv = mInv(mSub(I, S), 1 + mMaxAbs(S));   // operand scale: I − S cancels
  return inv ? mScale(mMul(mAdd(I, S), inv), z0) : null;
}
function sToY(S, z0) {
  const I = mEye(S.length);
  const inv = mInv(mAdd(I, S), 1 + mMaxAbs(S));
  return inv ? mScale(mMul(mSub(I, S), inv), 1 / z0) : null;
}
function zToS(Z, z0) {
  const I = mEye(Z.length);
  const inv = mInv(mAdd(Z, mScale(I, z0)), mMaxAbs(Z) + z0);
  return inv ? mMul(mSub(Z, mScale(I, z0)), inv) : null;
}
// Terminate port k with reflection gk; returns the remaining (n-1)-port S-matrix.
function reduceS(S, k, gk) {
  const n = S.length;
  const keep = [];
  for (let i = 0; i < n; i++) if (i !== k) keep.push(i);
  const den = csub(CONE, cmul(S[k][k], gk));
  return keep.map(i => keep.map(j => cadd(S[i][j], cdiv(cmul(cmul(S[i][k], S[k][j]), gk), den))));
}

// ------------------------------------------------------------- cascade -----
// stages: [{g (dB), nf (dB), oip3 (dBm, NaN = ideal), op1 (dBm, NaN = ideal)}]
function cascade(stages) {
  const out = [];
  let G = 1, F = 1, o3 = Infinity, o1 = Infinity;
  const comb = (oPrev, gi, oi) => {
    const a = isFinite(oPrev) ? 1 / (oPrev * gi) : 0;
    const b = isFinite(oi) ? 1 / oi : 0;
    return (a + b) > 0 ? 1 / (a + b) : Infinity;
  };
  const terms = [];
  stages.forEach((s, i) => {
    const gi = fromDbp(s.g), fi = fromDbp(s.nf);
    terms.push(i === 0 ? fi - 1 : (fi - 1) / G);
    F = i === 0 ? fi : F + (fi - 1) / G;
    o3 = comb(i === 0 ? Infinity : o3, gi, isFinite(s.oip3) ? fromDbp(s.oip3) : Infinity);
    o1 = comb(i === 0 ? Infinity : o1, gi, isFinite(s.op1) ? fromDbp(s.op1) : Infinity);
    G *= gi;
    out.push({ g: dbp(G), nf: dbp(F), oip3: dbp(o3), iip3: dbp(o3) - dbp(G), op1: dbp(o1), ip1: dbp(o1) - dbp(G) + 1 });
  });
  const exc = F - 1;
  out.forEach((r, i) => { r.contrib = exc > 0 ? terms[i] / exc * 100 : 0; });
  return out;
}

// ----------------------------------------------------------- L-network -----
// Match a load ZL = RL + jXL to a real source resistance Rs (Pozar 5.1).
// Returns every valid solution with element values at frequency f.
function lMatch(Rs, RL, XL, f) {
  const w = 2 * PI * f;
  const sols = [];
  const zl = cx(RL, XL);
  const series = X => Math.abs(X) < 1e-12 ? { kind: 'none', text: '— (none)' }
    : X > 0 ? { kind: 'L', val: X / w, text: 'L = ' + fmtSI(X / w, 'H') }
            : { kind: 'C', val: -1 / (w * X), text: 'C = ' + fmtSI(-1 / (w * X), 'F') };
  const shunt = B => Math.abs(B) < 1e-15 ? { kind: 'none', text: '— (none)' }
    : B > 0 ? { kind: 'C', val: B / w, text: 'C = ' + fmtSI(B / w, 'F') }
            : { kind: 'L', val: -1 / (w * B), text: 'L = ' + fmtSI(-1 / (w * B), 'H') };
  const typeOf = (se, sh) => {
    if (se.kind === 'L' && sh.kind === 'C') return 'Low-pass';
    if (se.kind === 'C' && sh.kind === 'L') return 'High-pass';
    if (se.kind === 'none' && sh.kind === 'none') return 'Already matched (no elements)';
    if (se.kind === 'none' || sh.kind === 'none') return 'Single element';
    return 'Band-pass type';
  };
  // RL = Rs gives the same series-only (or empty) network from both topologies: list it once,
  // under a name that does not mention a shunt element it does not have.
  const add = sol => {
    if (sols.some(t => Math.abs(t.X - sol.X) <= 1e-9 * Math.max(1, Rs, Math.abs(sol.X)) &&
                       Math.abs(t.B - sol.B) <= 1e-9 * Math.max(1 / Math.max(Rs, 1e-300), Math.abs(sol.B)))) return;
    if (sol.se.kind === 'none' && sol.sh.kind === 'none') { sol.topo = 'Direct connection'; sol.order = 'Source → load'; }
    else if (sol.sh.kind === 'none') { sol.topo = 'Series element only'; sol.order = 'Source → series → load'; }
    else if (sol.se.kind === 'none') { sol.topo = 'Shunt element only'; sol.order = 'Source → [shunt ∥ load]'; }
    sols.push(sol);
  };
  // (a) shunt B across the load, then series X toward the source
  const m2 = RL * RL + XL * XL;
  if (RL > 0 && m2 - Rs * RL >= -1e-12) {
    const r = sqrt(RL / Rs) * sqrt(Math.max(0, m2 - Rs * RL));
    for (const sgn of [1, -1]) {
      const B = (XL + sgn * r) / m2;
      const X = Math.abs(B) < 1e-15 ? -XL : 1 / B + XL * Rs / RL - Rs / (B * RL);
      const zp = cinv(cadd(cinv(zl), cx(0, B)));
      const zin = cadd(zp, cx(0, X));
      if (cabs(csub(zin, cx(Rs))) < 1e-6 * Math.max(1, Rs)) {
        const se = series(X), sh = shunt(B);
        add({ topo: 'Shunt element at the load', order: 'Source → series → [shunt ∥ load]', X: X, B: B, se: se, sh: sh, type: typeOf(se, sh) });
      }
      if (r === 0) break;
    }
  }
  // (b) series X at the load, then shunt B across the source side
  if (RL > 0 && RL <= Rs) {
    const r = sqrt(RL * (Rs - RL));
    for (const sgn of [1, -1]) {
      const X = sgn * r - XL;
      const B = sgn * sqrt((Rs - RL) / RL) / Rs;
      const zs = cadd(zl, cx(0, X));
      const zin = cinv(cadd(cinv(zs), cx(0, B)));
      if (cabs(csub(zin, cx(Rs))) < 1e-6 * Math.max(1, Rs)) {
        const se = series(X), sh = shunt(B);
        add({ topo: 'Shunt element at the source', order: 'Source → [shunt] → series → load', X: X, B: B, se: se, sh: sh, type: typeOf(se, sh) });
      }
      if (r === 0) break;
    }
  }
  return sols;
}

// --------------------------------------------------------- attenuators -----
// Returns [R1, R2] for topology 'pi' (R1 shunt, R2 series), 'tee' (R1 series, R2 shunt),
// 'btee' (R1 bridge, R2 shunt; the two fixed arms equal Z0).
function attenR(topo, z0, adb) {
  const K = fromDbv(adb);
  if (topo === 'pi') return [z0 * (K + 1) / (K - 1), z0 * (K * K - 1) / (2 * K)];
  if (topo === 'tee') return [z0 * (K - 1) / (K + 1), z0 * 2 * K / (K * K - 1)];
  return [z0 * (K - 1), z0 / (K - 1)];
}

// Real S-matrix of a resistive pad from nodal analysis, reference z0 at both ports.
// R: pi [shunt in, series, shunt out] · tee [series in, shunt, series out] ·
//    btee [arm in, arm out, bridge, shunt]
function resistive2port(topo, R, z0) {
  const g = r => 1 / r;
  let Y;
  if (topo === 'pi') {
    const gs = g(R[1]);
    Y = [[g(R[0]) + gs, -gs], [-gs, g(R[2]) + gs]];
  } else {
    // internal node 3 is eliminated (Kron reduction)
    let G;
    if (topo === 'tee') {
      const a = g(R[0]), b = g(R[2]), c = g(R[1]);
      G = [[a, 0, -a], [0, b, -b], [-a, -b, a + b + c]];
    } else {
      const a = g(R[0]), b = g(R[1]), br = g(R[2]), sh = g(R[3]);
      G = [[a + br, -br, -a], [-br, b + br, -b], [-a, -b, a + b + sh]];
    }
    const k = (i, j) => G[i][j] - G[i][2] * G[2][j] / G[2][2];
    Y = [[k(0, 0), k(0, 1)], [k(1, 0), k(1, 1)]];
  }
  // S = (I − z0·Y)(I + z0·Y)⁻¹
  const A = [[1 + z0 * Y[0][0], z0 * Y[0][1]], [z0 * Y[1][0], 1 + z0 * Y[1][1]]];
  const B = [[1 - z0 * Y[0][0], -z0 * Y[0][1]], [-z0 * Y[1][0], 1 - z0 * Y[1][1]]];
  const det = A[0][0] * A[1][1] - A[0][1] * A[1][0];
  const Ai = [[A[1][1] / det, -A[0][1] / det], [-A[1][0] / det, A[0][0] / det]];
  const m = (i, j) => B[i][0] * Ai[0][j] + B[i][1] * Ai[1][j];
  return [[m(0, 0), m(0, 1)], [m(1, 0), m(1, 1)]];
}

// Attenuation spread of a pad built from (optionally E-series-snapped) resistors
// with ±tolPct tolerance: worst case over all corners, plus an RSS estimate.
function attenTolerance(topo, z0, r1, r2, tolPct, build) {
  const parts = topo === 'pi' ? [['R1 (shunt, ×2)', r1], ['R2 (series)', r2], ['R1 (shunt, ×2)', r1]]
    : topo === 'tee' ? [['R1 (series, ×2)', r1], ['R2 (shunt)', r2], ['R1 (series, ×2)', r1]]
    : [['Arms (×2)', z0], ['Arms (×2)', z0], ['R1 (bridge)', r1], ['R2 (shunt)', r2]];
  const snap = x => build === 'exact' || !E_SERIES[build] ? x : nearestE(x, build).best;
  const vals = parts.map(p => snap(p[1]));
  const evalR = R => {
    const S = resistive2port(topo, R, z0);
    return { a: -dbv(Math.abs(S[1][0])), rl: -dbv(Math.max(Math.abs(S[0][0]), Math.abs(S[1][1]))) };
  };
  const nom = evalR(vals);
  const t = tolPct / 100;
  const n = vals.length;
  let min = Infinity, max = -Infinity, rlWorst = nom.rl;
  for (let mask = 0; mask < (1 << n); mask++) {
    const r = evalR(vals.map((x, i) => x * (1 + ((mask >> i) & 1 ? t : -t))));
    min = Math.min(min, r.a);
    max = Math.max(max, r.a);
    rlWorst = Math.min(rlWorst, r.rl);
  }
  let rss = 0;
  for (let i = 0; i < n; i++) {
    const up = vals.slice(), dn = vals.slice();
    up[i] *= 1 + t; dn[i] *= 1 - t;
    const d = Math.max(Math.abs(evalR(up).a - nom.a), Math.abs(evalR(dn).a - nom.a));
    rss += d * d;
  }
  const built = [];
  parts.forEach((p, i) => {
    if (!built.some(b => b.label === p[0])) built.push({ label: p[0], val: vals[i], dev: (vals[i] - p[1]) / p[1] * 100 });
  });
  return { built: built, att0: nom.a, rl0: nom.rl, min: min, max: max, rss: sqrt(rss), rlWorst: rlWorst };
}

  ],
  outputs: [
    O('S11 / Γ in dB', v => dbv(v.g), 'dB'),
  ],
  note: 'VSWR = (1+|Γ|)/(1−|Γ|) · RL = −20·log|Γ| · ML = −10·log(1−|Γ|²)',
},
{

    O('Mismatch loss', v => -dbp(1 - v.g * v.g), 'dB'),

  note: 'Γ = (Z − Z₀)/(Z + Z₀). Enter |Γ| and its angle (or VSWR and angle) to get R and X.',
},
{
  id: 'spower2', cat: 'mismatch', title: 'S-Parameters: Simple Power View (2-Port)', kw: 's11 s21 power transfer insertion loss magnitude',
  desc: 'Uses magnitudes only (no phase) and shows where the input power goes: reflected, transmitted or dissipated. Fill any 3 independent values. For example, enter S11 and the loss to get S21. |S11|, return loss, VSWR and reflected power are views of one quantity and count once.',
  vars: [
    dbV('s11', '|S11|', -15, 'dB'),
    dbV('s21', '|S21|', -0.5, 'dB'),
    dbV('pin', 'Input power', 0, 'dBm', { sticky: true }),
    dbV('rl', 'Return loss', undefined, 'dB'),
    posV('vswr', 'Input VSWR', undefined, ': 1', { min: 1, max: 1e18 }),
    linV('refl', 'Reflected power', undefined, '%', { min: 0, max: 100 }),
    linV('trans', 'Transmitted power', undefined, '%', { min: 0, max: 1e9 }),
    linV('loss', 'Dissipated (lost) power', undefined, '%', { min: -1e9, max: 100 }),
    dbV('il', 'Insertion loss (−S21)'),
    dbV('ml', 'Mismatch-loss part', undefined, 'dB', { min: 0 }),
    dbV('dl', 'Dissipative-loss part'),
    dbV('pout', 'Output power (port 2)', undefined, 'dBm'),
    dbV('prefl', 'Reflected power', undefined, 'dBm'),
    dbV('ploss', 'Dissipated power', undefined, 'dBm'),
  ],
  eqs: [
    E('rl', ['s11'], v => -v.s11, { s11: v => -v.rl }),
    E('vswr', ['s11'], v => vswrOf(fromDbv(v.s11)), { s11: v => dbv(gammaOfVswr(v.vswr)) }),
    E('refl', ['s11'], v => 100 * fromDbp(v.s11), { s11: v => dbp(v.refl / 100) }),
    E('trans', ['s21'], v => 100 * fromDbp(v.s21), { s21: v => dbp(v.trans / 100) }),
    E('loss', ['refl', 'trans'], v => 100 - v.refl - v.trans, { refl: v => 100 - v.loss - v.trans, trans: v => 100 - v.loss - v.refl }),
    E('il', ['s21'], v => -v.s21, { s21: v => -v.il }),
    E('ml', ['refl'], v => -dbp(1 - v.refl / 100), { refl: v => 100 * (1 - fromDbp(-v.ml)) }),
    // dissipative loss = IL − ML = −10·log|S21|² + 10·log(1 − |S11|²), written with the % shares
    E('dl', ['trans', 'refl'], v => -dbp(v.trans / 100) + dbp(1 - v.refl / 100), {
      trans: v => (100 - v.refl) * fromDbp(-v.dl), refl: v => 100 - v.trans / fromDbp(-v.dl),
    }),
    E('pout', ['pin', 's21'], v => v.pin + v.s21, { pin: v => v.pout - v.s21, s21: v => v.pout - v.pin }),
    E('prefl', ['pin', 's11'], v => v.pin + v.s11, { pin: v => v.prefl - v.s11, s11: v => v.prefl - v.pin }),
    E('ploss', ['pin', 'loss'], v => v.pin + dbp(v.loss / 100), { pin: v => v.ploss - dbp(v.loss / 100), loss: v => 100 * fromDbp(v.ploss - v.pin) }),
  ],
  outputs: [
    O('Output power', v => 1e-3 * fromDbp(v.pout), 'W', true),
    O('Reflected power', v => 1e-3 * fromDbp(v.prefl), 'W', true),
    O('Dissipated power', v => 1e-3 * fromDbp(v.pin) * v.loss / 100, 'W', true),
    O('Share of IL caused by mismatch', v => v.il > 0 ? 100 * v.ml / v.il : NaN, '%'),
  ],
  guess: v => {
    // lost power + dissipative loss: refl = 100 − loss/(1 − 10^(−dl/10)), trans = (100 − refl)·10^(−dl/10)
    if (isFinite(v.loss) && isFinite(v.dl) && v.dl !== 0) {
      const a = fromDbp(-v.dl), refl = 100 - v.loss / (1 - a);
      return { refl: refl, trans: (100 - refl) * a };
    }
    // output + dissipated power with a known reflection: P_in = (P_out + P_loss)/(1 − |S11|²)
    let refl = v.refl;
    if (!isFinite(refl) && isFinite(v.s11)) refl = 100 * fromDbp(v.s11);
    if (!isFinite(refl) && isFinite(v.rl)) refl = 100 * fromDbp(-v.rl);
    if (!isFinite(refl) && isFinite(v.vswr)) { const g = gammaOfVswr(v.vswr); refl = 100 * g * g; }
    if (isFinite(v.pout) && isFinite(v.ploss) && isFinite(refl) && refl < 100) {
      const pin = dbp((fromDbp(v.pout) + fromDbp(v.ploss)) / (1 - refl / 100));
      return { pin: pin, s21: v.pout - pin, il: pin - v.pout, trans: 100 * fromDbp(v.pout - pin),
        loss: 100 * fromDbp(v.ploss - pin), refl: refl, s11: dbp(refl / 100) };
    }
    return null;
  },
  chart: v => powerChart2(v),
  warn: v => (v.s11 > S11_ACTIVE_DB) ? ACTIVE_S11 : (v.loss < -1e-9) ? '⚠ |S11|² + |S21|² > 1. This is not a passive network (it has gain, or the data has an error).' : null,
  note: 'Reflected = |S11|² · Transmitted = |S21|² · Lost = 1 − |S11|² − |S21|². IL = mismatch loss −10·log(1−|S11|²) + dissipative loss.',
},
{
  id: 'spower3', cat: 'mismatch', title: 'S-Parameters: Simple Power View (3-Port)', kw: 'splitter divider power split s31 magnitude',
  desc: 'Port 1 is driven and ports 2 and 3 are outputs (for example a splitter or coupler). Uses magnitudes only. Fill any 4 independent values, for example return loss, split ratio, excess loss and input power.',
  vars: [
    dbV('s11', '|S11|', -20, 'dB'),
    dbV('s21', '|S21|', -3.2, 'dB'),
    dbV('s31', '|S31|', -3.3, 'dB'),
    dbV('pin', 'Input power', 0, 'dBm', { sticky: true }),
    dbV('rl', 'Input return loss', undefined, 'dB'),
    linV('refl', 'Reflected power', undefined, '%', { min: 0, max: 100 }),
    linV('p2', 'Power to port 2', undefined, '%', { min: 0, max: 1e9 }),
    linV('p3', 'Power to port 3', undefined, '%', { min: 0, max: 1e9 }),
    linV('loss', 'Dissipated (lost) power', undefined, '%', { min: -1e9, max: 100 }),
    dbV('ratio', 'Split ratio S21 − S31'),
    dbV('el', 'Excess loss (vs. ideal lossless split)'),
    dbV('out2', 'Output power port 2', undefined, 'dBm'),
    dbV('out3', 'Output power port 3', undefined, 'dBm'),
  ],
  eqs: [
    E('rl', ['s11'], v => -v.s11, { s11: v => -v.rl }),
    E('refl', ['s11'], v => 100 * fromDbp(v.s11), { s11: v => dbp(v.refl / 100) }),
    E('p2', ['s21'], v => 100 * fromDbp(v.s21), { s21: v => dbp(v.p2 / 100) }),
    E('p3', ['s31'], v => 100 * fromDbp(v.s31), { s31: v => dbp(v.p3 / 100) }),
    E('loss', ['refl', 's21', 's31'], v => 100 - v.refl - 100 * fromDbp(v.s21) - 100 * fromDbp(v.s31), {
      refl: v => 100 - v.loss - 100 * fromDbp(v.s21) - 100 * fromDbp(v.s31),
      s21: v => dbp((100 - v.loss - v.refl) / 100 - fromDbp(v.s31)),
      s31: v => dbp((100 - v.loss - v.refl) / 100 - fromDbp(v.s21)),
    }),
    E('ratio', ['s21', 's31'], v => v.s21 - v.s31, { s21: v => v.ratio + v.s31, s31: v => v.s21 - v.ratio }),
    E('el', ['s21', 's31'], v => -dbp(fromDbp(v.s21) + fromDbp(v.s31)), {
      s21: v => dbp(fromDbp(-v.el) - fromDbp(v.s31)), s31: v => dbp(fromDbp(-v.el) - fromDbp(v.s21)),
    }),
    E('out2', ['pin', 's21'], v => v.pin + v.s21, { pin: v => v.out2 - v.s21, s21: v => v.out2 - v.pin }),
    E('out3', ['pin', 's31'], v => v.pin + v.s31, { pin: v => v.out3 - v.s31, s31: v => v.out3 - v.pin }),
  ],
  outputs: [
    O('Input VSWR', v => v.s11 > S11_ACTIVE_DB ? '∞ (|Γ| > 1, active)' : vswrOf(Math.min(1, fromDbv(v.s11))), ': 1'),
    O('Amplitude imbalance |S21 − S31|', v => Math.abs(v.ratio), 'dB'),
    O('Share of output power at port 2', v => 100 * v.p2 / (v.p2 + v.p3), '%'),
    O('Excess IL port 2 vs. ideal 3 dB split', v => -v.s21 - dbp(2), 'dB'),
    O('Excess IL port 3 vs. ideal 3 dB split', v => -v.s31 - dbp(2), 'dB'),
    O('Dissipated power', v => 1e-3 * fromDbp(v.pin) * v.loss / 100, 'W', true),
  ],
  guess: v => {
    // split ratio r = S21 − S31 with the total output share t: S21 = 10·log(t·k/(1+k)), k = 10^(r/10)
    if (!isFinite(v.ratio)) return null;
    const k = fromDbp(v.ratio);
    let t = NaN;
    if (isFinite(v.el)) t = fromDbp(-v.el);
    else if (isFinite(v.loss) && isFinite(v.refl)) t = (100 - v.loss - v.refl) / 100;
    if (!(t > 0)) return null;
    const s21 = dbp(t * k / (1 + k));
    return { s21: s21, s31: s21 - v.ratio };
  },
  chart: v => powerChart3(v),
  warn: v => (v.s11 > S11_ACTIVE_DB) ? ACTIVE_S11 : (v.loss < -1e-9) ? '⚠ |S11|² + |S21|² + |S31|² > 1. This is not a passive network.' : null,
  note: 'Lost = 1 − |S11|² − |S21|² − |S31|² · Excess loss = −10·log(|S21|² + |S31|²)',
},

  ],
  outputs: [

{
  id: 'resonance', cat: 'matching', title: 'LC Resonance, Q & Bandwidth', kw: 'resonant frequency tank q factor bandwidth rlc',
  desc: 'Series RLC resonator. Enter any 3 independent values of L, C, R, f₀, Q and BW. L, C and f₀ are linked, and so are f₀, Q and BW, and L, R and BW (BW = R/2πL does not depend on C).',
  vars: [
    uV('L', 'Inductance L', 'H', 'nH', 100e-9, { finite: true }),
    uV('C', 'Capacitance C', 'F', 'pF', 10e-12, { finite: true }),
    fq('f0', 'Resonant frequency f₀', undefined, 'MHz', { finite: true }),
    ohmV('Rs', 'Series resistance R<sub>s</sub>', 1, { inMin: 0 }),   // 0 = lossless
    posV('Q', 'Quality factor Q', undefined, '', { max: 1e300 }),
    fq('bw', '3 dB bandwidth', undefined, 'MHz', { min: 0 }),   // 0 for a lossless resonator (Rs = 0, Q = ∞)
  ],
  eqs: [
    E('f0', ['L', 'C'], v => 1 / (2 * PI * sqrt(v.L * v.C)), {
      L: v => 1 / (Math.pow(2 * PI * v.f0, 2) * v.C), C: v => 1 / (Math.pow(2 * PI * v.f0, 2) * v.L),
    }),
    E('bw', ['Rs', 'L'], v => v.Rs / (2 * PI * v.L), { Rs: v => 2 * PI * v.L * v.bw, L: v => v.Rs / (2 * PI * v.bw) }),
    E('Q', ['f0', 'bw'], v => v.f0 / v.bw, { f0: v => v.Q * v.bw, bw: v => v.f0 / v.Q }),
  ],
  guess: v => {
    // C, R and Q: L = C·(Q·R)² from Q = √(L/C)/R
    if (!(isFinite(v.C) && isFinite(v.Rs) && isFinite(v.Q))) return null;
    const L = v.C * Math.pow(v.Q * v.Rs, 2);
    return { L: L, f0: 1 / (2 * PI * sqrt(L * v.C)), bw: v.Rs / (2 * PI * L) };
  },
  outputs: [
    O('Characteristic impedance √(L/C)', v => sqrt(v.L / v.C), 'Ω', true),
    O('Reactance at f₀', v => 2 * PI * v.f0 * v.L, 'Ω', true),
    O('Equivalent parallel R<sub>p</sub> = R<sub>s</sub>(1+Q²)', v => v.Rs === 0 ? Infinity : v.Rs * (1 + v.Q * v.Q), 'Ω', true),
    O('Angular frequency ω₀', v => 2 * PI * v.f0, 'rad/s'),

  // lossless (R = 0, Q = ∞ or BW = 0): BW and Q no longer fix L or C, only f₀ = 1/(2π√LC) does
  warn: v => ((v.Rs === 0 || v.Q === Infinity || v.bw === 0) &&
      (isNaN(v.Rs) || v.Rs === 0) && (isNaN(v.Q) || v.Q === Infinity) && (isNaN(v.bw) || v.bw === 0) &&
      !(isFinite(v.L) && isFinite(v.C)))
    ? 'A lossless resonator (R = 0, Q = ∞, BW = 0) does not fix L and C: enter two of L, C and f₀.' : null,
  note: 'f₀ = 1/(2π√(LC)) · BW = R<sub>s</sub>/(2πL) · Q = f₀/BW = √(L/C)/R<sub>s</sub>',
},

// ---- helpers used by the definitions above --------------------------------
function mixS(v) { return v.$.mode === 'low' ? -1 : 1; }
// receiver noise temperature from the noise figure (defined at T₀ = 290 K)
function teOf(nf) { return 290 * (fromDbp(nf) - 1); }
// total (source + receiver) noise temperature behind a noise floor in bandwidth bw
function tSysOf(v) { return fromDbp(v.floor) / (KB * 1000 * v.bw); }
// Friis / FSPL is a far-field model
const nearField = (d, f) => d > 0 && f > 0 && d < 2 * lam(f);
const NEAR_FIELD = '⚠ The distance is less than 2λ, in the antenna near field. The Friis free-space model needs d ≫ λ and d > 2D²/λ, so the path loss shown is not physical here (it drops to 0 dB at d = λ/4π).';
// Microstrip dielectric loss (Pozar 3.198): α_d = k₀·εr·q·tanδ / (2√εeff), q = (εeff − 1)/(εr − 1).
// q is 0/0 at εr = 1, so near 1 it is taken at εr = 1 + 1e-6 (it is continuous there).
function msLossD(v) {
  const ee = microstrip(v.W, v.H, v.T, v.er).ee;
  const k0 = 2 * PI * v.f / C0;
  const erq = v.er - 1 < 1e-6 ? 1 + 1e-6 : v.er;
  const q = erq === v.er ? (ee - 1) / (v.er - 1) : (microstrip(v.W, v.H, v.T, erq).ee - 1) / (erq - 1);
  return DB_NEPER * k0 * v.er * q * v.tand / (2 * sqrt(ee));
}
// Microstrip conductor loss, smooth annealed copper: α_c = R_s/(Z₀W)
function msLossC(v) { return DB_NEPER * sqrt(PI * v.f * MU0 * RHO_CU_ANNEALED) / (v.Z0 * v.W); }
function qwtBw(z0, zl, gm) {
  if (!(z0 > 0 && zl > 0)) return NaN;
  if (Math.abs(zl - z0) < 1e-12) return Infinity;
  const arg = gm / sqrt(1 - gm * gm) * 2 * sqrt(z0 * zl) / Math.abs(zl - z0);
  if (arg >= 1) return 200;
  return 100 * (2 - 4 / PI * Math.acos(arg));
}
function bandTxt(fc, bw) {
  if (!isFinite(fc) || !isFinite(bw)) return NaN;
  return fmtSI(fc - bw / 2, 'Hz', 6) + ' – ' + fmtSI(fc + bw / 2, 'Hz', 6);
}
const sgn = (x, sig) => (x >= 0 ? '+' : '') + fmt(Math.abs(x) < 1e-12 ? 0 : x, sig);
const pct = x => sgn(x, 3) + ' %';
let _tolKey = '', _tolVal = null;
function tolCase(v) {
  if (![v.z0, v.a, v.r1, v.r2].every(x => isFinite(x) && x > 0)) return null;
  const key = [v.$.topo, v.$.tol, v.$.build, v.z0, v.a, v.r1, v.r2].join('|');
  if (key !== _tolKey) { _tolKey = key; _tolVal = attenTolerance(v.$.topo, v.z0, v.r1, v.r2, +v.$.tol, v.$.build); }
  return _tolVal;
}
function eTxt(x) {
  const a = nearestE(x, 'E24'), b = nearestE(x, 'E96');
  if (!a || !b) return NaN;
  return fmtSI(a.best, 'Ω', 4) + ' (' + (a.err >= 0 ? '+' : '') + a.err.toFixed(1) + ' %) / ' +
         fmtSI(b.best, 'Ω', 4) + ' (' + (b.err >= 0 ? '+' : '') + b.err.toFixed(1) + ' %)';
}

  outputs: [

    O('Wanted signal at the receiver', v => v.erps - v.ls + v.grs, 'dBm'),
    O('Jammer path model', v => b1ModelName(v.$.model, v.f, v.dj, v.hj, v.hr)),
    O('Signal path model', v => b1ModelName(v.$.model, v.f, v.ds, v.hs, v.hr)),
    O('Crossover distance, jammer path', v => b1Dc(v.f, v.hj, v.hr), 'm', true),

  note: 'J/S = EIRP<sub>J</sub> − L<sub>J</sub> + G<sub>RJ</sub> − (EIRP<sub>S</sub> − L<sub>S</sub> + G<sub>RS</sub>). EIRP is referenced to an isotropic radiator (Adamy writes ERP for it); for a dipole-referenced ERP (dBd) add 2.15 dB. J/S does not change as long as both powers use the same reference. Two-ray: L = 40·log d − 20·log h<sub>t</sub> − 20·log h<sub>r</sub> (frequency independent). Crossover d<sub>c</sub> = 4π·h<sub>t</sub>·h<sub>r</sub>/λ (Adamy\'s 24 000 rule is the rounded form). The smooth model adds the two losses linearly: it never falls below the larger (applicable) asymptote and is at most 3 dB (10·log 2) above it, the maximum being at d = d<sub>c</sub>. Both models need line of sight: radio horizon √(2kR·h<sub>t</sub>) + √(2kR·h<sub>r</sub>), k = 4/3. Typical required J/S for digital comms: about 0 dB.',
},

// ============================================================================
// b2.js - phase 2, batch 2 (pure): two-tone IP3 / SFDR, ADC, phase noise →
// jitter, spur & harmonic products, LC filter prototypes.
// Every top-level name starts with b2 (single shared script).
// ============================================================================

// ------------------------------------------------- phase noise → jitter ---
// pts: [[offset Hz, L dBc/Hz], ...] sorted by offset. L is single-sideband.
// Between points L(f) is a straight line in log-log, i.e. a power law
// S(f) = S_a·(f/f_a)^k with k = slope(dB/dec)/10, integrated exactly.
function b2PnIntegrate(pts, f1, f2) {
  const p = pts.filter(q => q[0] > 0 && isFinite(q[0]) && isFinite(q[1])).sort((a, b) => a[0] - b[0]);
  if (p.length < 2 || !(f2 > f1) || !(f1 > 0)) return { p: NaN, lo: NaN, hi: NaN, clipped: false };
  const lo = Math.max(f1, p[0][0]), hi = Math.min(f2, p[p.length - 1][0]);
  let sum = 0;
  for (let i = 0; i < p.length - 1; i++) {
    const [fa, La] = p[i], [fb, Lb] = p[i + 1];
    if (!(fb > fa)) continue;
    const x1 = Math.max(lo, fa), x2 = Math.min(hi, fb);
    if (!(x2 > x1)) continue;
    const k = (Lb - La) / log10(fb / fa) / 10;
    const Sa = fromDbp(La);
    if (Math.abs(k + 1) < 1e-9) sum += Sa * fa * Math.log(x2 / x1);
    else sum += Sa * fa * (Math.pow(x2 / fa, k + 1) - Math.pow(x1 / fa, k + 1)) / (k + 1);
  }
  return { p: sum, lo: lo, hi: hi, clipped: lo > f1 * (1 + 1e-12) || hi < f2 * (1 - 1e-12) };
}
// L(f) at an offset by log-log interpolation (NaN outside the table).
// An offset within round-off (1e-12 relative) of the first or last point
// snaps to it, so 10^log10(f) at the table ends still finds a segment.
function b2PnAt(pts, f) {
  const p = pts.filter(q => q[0] > 0 && isFinite(q[1])).sort((a, b) => a[0] - b[0]);
  if (p.length && Math.abs(f / p[0][0] - 1) < 1e-12) f = p[0][0];
  if (p.length && Math.abs(f / p[p.length - 1][0] - 1) < 1e-12) f = p[p.length - 1][0];
  for (let i = 0; i < p.length - 1; i++) {
    if (f >= p[i][0] && f <= p[i + 1][0]) {
      const t = log10(f / p[i][0]) / log10(p[i + 1][0] / p[i][0]);
      return p[i][1] + t * (p[i + 1][1] - p[i][1]);
    }
  }
  return NaN;
}
// Derived figures from the integrated SSB phase noise power p (rad²/2).
// evm and snr are the small-angle forms (EVM ≈ φrms); evmGauss is the EVM for
// a Gaussian phase error of that RMS, √(2(1 − e^(−φ²/2))), which never exceeds
// √2 = 141 %. Above about 0.2 rad the small-angle forms are no longer accurate.
function b2PnResults(p, f0) {
  const phi = sqrt(2 * p);
  return {
    large: phi > 0.2,
    ssb: dbp(p),                  // 10·log ∫L(f) df, dBc
    dsb: dbp(2 * p),              // both sidebands, dBc
    phiRad: phi,
    phiDeg: phi * 180 / PI,
    jitter: phi / (2 * PI * f0),
    evm: 100 * phi,               // small-angle EVM limit, %
    evmGauss: 100 * sqrt(2 * (1 - Math.exp(-phi * phi / 2))), // Gaussian phase error, %
    snr: -dbp(2 * p),             // phase-noise-limited SNR, dB
  };
}

// ------------------------------------------------- spur / product table ---
// Products |m·RF + n·LO| for m ≥ 0, |m| + |n| ≤ N. RF and LO are bands
// (lo1 = lo2 for a fixed LO); the range uses interval arithmetic (both vary
// independently, which is conservative for a tracking LO).
function b2Range(m, n, rf1, rf2, lo1, lo2) {
  const c = [m * rf1 + n * lo1, m * rf1 + n * lo2, m * rf2 + n * lo1, m * rf2 + n * lo2];
  const a = Math.min(...c), b = Math.max(...c);

  return a > 0 ? [a, b] : [-b, -a];
}
function b2Products(o) {
  const { rf1, rf2, lo1, lo2, if1, if2, N, desired } = o;
  const want = desired === 'up' ? [1, 1] : [1, -1];
  const rows = [];
  for (let m = 0; m <= N; m++) {
    for (let n = -N; n <= N; n++) {
      if (m + Math.abs(n) > N || (m === 0 && n <= 0)) continue;
      const [f1, f2] = b2Range(m, n, rf1, rf2, lo1, lo2);
      const ov = Math.min(f2, if2) - Math.max(f1, if1);
      const inband = ov >= 0 && !(f2 < if1 || f1 > if2);
      const kind = (m === want[0] && n === want[1]) ? 'desired'
        : n === 0 ? (m === 1 ? 'RF feedthrough' : 'RF harmonic')
        : m === 0 ? (n === 1 ? 'LO feedthrough' : 'LO harmonic') : 'mixing product';
      rows.push({ m: m, n: n, order: m + Math.abs(n), f1: f1, f2: f2, inband: inband,
        overlap: inband ? Math.max(0, ov) / Math.max(1e-300, if2 - if1) : 0, kind: kind, text: b2ProdText(m, n) });
    }
  }
  rows.sort((a, b) => (a.kind === 'desired' ? -1 : 0) - (b.kind === 'desired' ? -1 : 0) || a.order - b.order || a.f1 - b.f1);
  return rows;
}
function b2ProdText(m, n) {
  const t = (k, s) => (k === 1 ? '' : k + '·') + s;
  if (n === 0) return t(m, 'RF');
  if (m === 0) return t(n, 'LO');
  return '|' + t(m, 'RF') + (n > 0 ? ' + ' : ' − ') + t(Math.abs(n), 'LO') + '|';
}

// ------------------------------------------------------ LC filters --------
// Low-pass prototype element values g0..g(n+1) (Matthaei/Pozar).
function b2FilterG(resp, n, ripple) {
  const g = [1];
  if (resp === 'cheby') {
    const beta = Math.log(1 / Math.tanh(ripple / 17.37));
    const gam = Math.sinh(beta / (2 * n));
    const a = k => Math.sin((2 * k - 1) * PI / (2 * n));
    const b = k => gam * gam + Math.pow(Math.sin(k * PI / n), 2);
    g.push(2 * a(1) / gam);
    for (let k = 2; k <= n; k++) g.push(4 * a(k - 1) * a(k) / (b(k - 1) * g[k - 1]));
    g.push(n % 2 ? 1 : Math.pow(1 / Math.tanh(beta / 4), 2));
  } else {
    for (let k = 1; k <= n; k++) g.push(2 * Math.sin((2 * k - 1) * PI / (2 * n)));
    g.push(1);
  }
  return g;
}
// Normalised stop-band frequency Ω (> 1 in the stop band)
function b2FilterOmega(type, fs, fc, f0, bw) {
  if (type === 'lpf') return fs / fc;
  if (type === 'hpf') return fc / fs;
  const d = bw / f0, x = Math.abs(fs / f0 - f0 / fs);
  return type === 'bpf' ? x / d : d / x;
}
// Minimum order for attenuation A (dB) at Ω; ripple only for Chebyshev
function b2FilterOrder(resp, A, ripple, Om) {
  if (!(Om > 1) || !(A > 0)) return NaN;
  if (resp === 'cheby') {
    // A ≤ ripple gives r ≤ 1: every order already attenuates more than the
    // ripple at Ω > 1, so N = 1 (acosh(1) = 0)
    const r = Math.max(1, sqrt((fromDbp(A) - 1) / (fromDbp(ripple) - 1)));
    return Math.max(1, Math.ceil(Math.acosh(r) / Math.acosh(Om) - 1e-9));

// ripple band, Ω₃ = cos(acos(1/ε)/N) < 1.
function b2Filter3dB(resp, n, ripple) {

function b2BandEdges(f0, bw) {

  return [f1, f1 + bw];
}
// Full design: o = { resp, ripple, type, n, fc, f0, bw, z0, first: 'shunt'|'series' }
// Each element: { k, arm: 'series'|'shunt', net: 'L'|'C'|'LCs'|'LCp', L, C }
function b2FilterDesign(o) {

    else if (o.type === 'bpf') e = shunt ? { net: 'LCp', L: d * R0 / (w0 * gk), C: gk / (w0 * d * R0) }
      : { net: 'LCs', L: gk * R0 / (w0 * d), C: d / (w0 * gk * R0) };
    else e = shunt ? { net: 'LCs', L: R0 / (w0 * gk * d), C: gk * d / (w0 * R0) }
      : { net: 'LCp', L: gk * d * R0 / w0, C: 1 / (w0 * gk * d * R0) };

  return v.ta + (L - 1) * v.tp + L * (v.te + tr / fromDbp(v.glna));
};

// ---- air-core single-layer coil (Wheeler, inches form) -------------------------
const b3WheelerL = (n, d, l) => { const di = d / 0.0254, li = l / 0.0254; return 1e-6 * di * di * n * n / (18 * di + 40 * li); };

// ---- Pi / T matching for a chosen loaded Q ------------------------------------
// topo: 'pi-lp', 'pi-hp', 't-lp', 't-hp'. Real source Rs and load RL.
function b3PiT(topo, Rs, RL, Q, f) {
  const w = 2 * PI * f, isPi = topo.startsWith('pi'), lp = topo.endsWith('lp');
  const Rh = Math.max(Rs, RL), Rl = Math.min(Rs, RL);
  const Qmin = sqrt(Rh / Rl - 1);
  if (!(Rs > 0 && RL > 0 && f > 0 && Q > 0)) return { err: 'Enter positive values.' };
  if (!(Q > Qmin + 1e-12)) return { err: 'Q must be larger than the minimum ' + fmt(Qmin, 4) + ' for this resistance ratio.', Qmin: Qmin };
  const els = [];
  const elem = (role, X) => {
    // X > 0: inductive reactance, X < 0: capacitive
    const kind = X > 0 ? 'L' : 'C';
    const val = X > 0 ? X / w : -1 / (w * X);
    els.push({ role: role, kind: kind, X: X, val: val });
  };
  let Rv, zin;
  const RLc = cx(RL);
  if (isPi) {
    Rv = Rh / (Q * Q + 1);
    const Q1 = sqrt(Rs / Rv - 1), Q2 = sqrt(RL / Rv - 1);
    const Xp1 = Rs / Q1, Xp2 = RL / Q2, Xs = Rv * (Q1 + Q2);
    const sh = lp ? -1 : 1, se = lp ? 1 : -1;
    elem('Shunt (source side)', sh * Xp1);
    elem('Series', se * Xs);
    elem('Shunt (load side)', sh * Xp2);
    let z = b3Par(RLc, cx(0, sh * Xp2));
    z = cadd(z, cx(0, se * Xs));
    zin = b3Par(z, cx(0, sh * Xp1));
  } else {
    Rv = Rl * (Q * Q + 1);
    const Q1 = sqrt(Rv / Rs - 1), Q2 = sqrt(Rv / RL - 1);
    const Xs1 = Q1 * Rs, Xs2 = Q2 * RL, Xp1 = Rv / Q1, Xp2 = Rv / Q2;
    const Xp = Xp1 * Xp2 / (Xp1 + Xp2);
    const sh = lp ? -1 : 1, se = lp ? 1 : -1;
    elem('Series (source side)', se * Xs1);
    elem('Shunt', sh * Xp);
    elem('Series (load side)', se * Xs2);
    let z = cadd(RLc, cx(0, se * Xs2));
    z = b3Par(z, cx(0, sh * Xp));
    zin = cadd(z, cx(0, se * Xs1));
  }
  return { els: els, Rv: Rv, Qmin: Qmin, zin: zin, bw: f / Q };
}

// ---- 2-port cascade (ABCD) ------------------------------------------------------
// Block types and their parameters: [key, label, default, unit]
const B3_BLOCKS = {
  sr:  { name: 'Series R', p: [['R', 'R', '50', 'Ω']] },
  sl:  { name: 'Series L', p: [['L', 'L', '10n', 'H']] },
  sc:  { name: 'Series C', p: [['C', 'C', '1p', 'F']] },
  sz:  { name: 'Series Z = R + jX', p: [['R', 'R', '0', 'Ω'], ['X', 'X', '50', 'Ω']] },
  shr: { name: 'Shunt R', p: [['R', 'R', '50', 'Ω']] },
  shl: { name: 'Shunt L', p: [['L', 'L', '10n', 'H']] },
  shc: { name: 'Shunt C', p: [['C', 'C', '1p', 'F']] },
  shz: { name: 'Shunt Z = R + jX', p: [['R', 'R', '0', 'Ω'], ['X', 'X', '-50', 'Ω']] },
  line: { name: 'Transmission line', p: [['zc', 'Z₀', '50', 'Ω'], ['deg', 'Length', '90', '° at f'], ['loss', 'Loss', '0', 'dB']] },
  att: { name: 'Matched attenuator', p: [['a', 'Attenuation', '3', 'dB']] },
  amp: { name: 'Matched amplifier', p: [['g', 'Gain', '20', 'dB'], ['iso', 'Reverse isolation', '40', 'dB']] },
  s:   { name: 'S-parameter block (at Z₀)', p: [['s11', '|S11|', '-20', 'dB'], ['a11', '∠S11', '0', '°'], ['s21', '|S21|', '-1', 'dB'], ['a21', '∠S21', '0', '°'],
                                            ['s12', '|S12|', '-1', 'dB'], ['a12', '∠S12', '0', '°'], ['s22', '|S22|', '-20', 'dB'], ['a22', '∠S22', '0', '°']] },
};
function b3BlockABCD(blk, f, z0) {
  const def = B3_BLOCKS[blk.type];
  if (!def) return { err: 'Unknown block' };
  const p = {};
  for (const [k] of def.p) {
    const x = parseNum(blk.v[k]);
    if (isNaN(x)) return { err: def.name + ': invalid ' + k };
    p[k] = x;
  }
  const w = 2 * PI * f;
  const series = z => [[cx(1), z], [cx(0), cx(1)]];
  const shunt = z => [[cx(1), cx(0)], [cinv(z), cx(1)]];
  switch (blk.type) {
    case 'sr': return { m: series(cx(p.R)) };
    case 'sl': return { m: series(cx(0, w * p.L)) };
    case 'sc': return { m: series(cx(0, -1 / (w * p.C))) };
    case 'sz': return { m: series(cx(p.R, p.X)) };
    case 'shr': return { m: shunt(cx(p.R)) };
    case 'shl': return { m: shunt(cx(0, w * p.L)) };
    case 'shc': return { m: shunt(cx(0, -1 / (w * p.C))) };
    case 'shz': return { m: shunt(cx(p.R, p.X)) };
    case 'line': {
      const gl = cx(p.loss / DB_NEPER, p.deg * PI / 180);
      const ch = b3Ccosh(gl), sh = b3Csinh(gl);
      return { m: [[ch, cscale(sh, p.zc)], [cscale(sh, 1 / p.zc), ch]] };
    }
    case 'att': { const k = fromDbv(-p.a); return { m: sToABCD([[cx(0), cx(k)], [cx(k), cx(0)]], z0) }; }
    case 'amp': return { m: sToABCD([[cx(0), cx(fromDbv(-p.iso))], [cx(fromDbv(p.g)), cx(0)]], z0), det: cx(fromDbv(-p.iso) / fromDbv(p.g)) };
    case 's': {
      const S = [[cpol(fromDbv(p.s11), p.a11), cpol(fromDbv(p.s12), p.a12)], [cpol(fromDbv(p.s21), p.a21), cpol(fromDbv(p.s22), p.a22)]];
      if (cabs(S[1][0]) === 0) return { err: 'S-parameter block needs S21 ≠ 0' };
      return { m: sToABCD(S, z0), det: cdiv(S[0][1], S[1][0]) };
    }
  }
  return { err: 'Unknown block' };
}
// det(ABCD) of the cascade is the product of the block determinants: exactly 1 for
// reciprocal blocks, S12/S21 for S-parameter-defined ones (Pozar 4.4).
function b3Cascade(blocks, f, z0) {
  let M = mEye(2), det = cx(1);
  for (let i = 0; i < blocks.length; i++) {
    const r = b3BlockABCD(blocks[i], f, z0);
    if (r.err) return { err: 'Block ' + (i + 1) + ': ' + r.err };
    M = mMul(M, r.m);
    if (r.det) det = cmul(det, r.det);
  }
  return { abcd: M, det: det, S: abcdToS(M, z0, det) };
}

{
  id: 'minloss', cat: 'comp', title: 'Minimum-Loss Matching Pad', kw: 'minimum loss pad 75 50 impedance matching resistive l pad',
  desc: 'Resistive L-pad between two different real impedances, matched in both directions with the lowest possible loss.',
  vars: [
    ohmV('zh', 'Higher impedance Z<sub>high</sub>', 75),
    ohmV('zl', 'Lower impedance Z<sub>low</sub>', 50),
    ohmV('r1', 'R1: series resistor (Z<sub>high</sub> side)'),
    ohmV('r2', 'R2: shunt resistor (Z<sub>low</sub> side)'),
    posV('loss', 'Minimum loss', undefined, 'dB', { min: 1e-12, max: 1e4 }),
  ],
  eqs: [
    E('r1', ['zh', 'zl'], v => v.zh * sqrt(1 - v.zl / v.zh), { zh: v => (v.zl + sqrt(v.zl * v.zl + 4 * v.r1 * v.r1)) / 2, zl: v => v.zh - v.r1 * v.r1 / v.zh }),
    // R2²·(Zh − Zl) = Zl²·Zh: Zh = Zl·R2²/(R2² − Zl²) (needs R2 > Zl), and Zl is the positive
    // root of Zl² + (R2²/Zh)·Zl − R2² = 0, written without cancellation
    E('r2', ['zh', 'zl'], v => v.zl / sqrt(1 - v.zl / v.zh), {
      zh: v => v.r2 > v.zl ? v.zl * v.r2 * v.r2 / (v.r2 * v.r2 - v.zl * v.zl) : NaN,
      zl: v => { const a = v.r2 * v.r2 / v.zh; return 2 * v.r2 * v.r2 / (a + sqrt(a * a + 4 * v.r2 * v.r2)); },
    }),
    E('loss', ['zh', 'zl'], v => dbv(sqrt(v.zh / v.zl) + sqrt(v.zh / v.zl - 1)), {
      zh: v => { const s = fromDbv(v.loss); return v.zl * Math.pow((s + 1 / s) / 2, 2); },
      zl: v => { const s = fromDbv(v.loss); return v.zh / Math.pow((s + 1 / s) / 2, 2); },
    }),
  ],
  guess: v => {
    if (!(isFinite(v.r1) && isFinite(v.r2))) return null;
    const q = v.r1 / v.r2 + 1, zl = sqrt(v.r1 * v.r2 / q);
    return { zh: q * zl, zl: zl };
  },
  outputs: [
    O('R1: nearest E24 / E96', v => eTxt(v.r1)),
    O('R2: nearest E24 / E96', v => eTxt(v.r2)),
    O('Impedance ratio', v => v.zh / v.zl, '×'),
  ],
  warn: v => (v.zl >= v.zh) ? '⚠ Z_high must be larger than Z_low.' : null,
  note: 'R1 = Z<sub>h</sub>·√(1 − Z<sub>l</sub>/Z<sub>h</sub>) · R2 = Z<sub>l</sub>/√(1 − Z<sub>l</sub>/Z<sub>h</sub>) · loss = 20·log(√(Z<sub>h</sub>/Z<sub>l</sub>) + √(Z<sub>h</sub>/Z<sub>l</sub> − 1)). Example: 75 → 50 Ω gives 43.3 Ω, 86.6 Ω and 5.72 dB.',
},
{
  id: 'wilkinson', cat: 'comp', title: 'Wilkinson Divider Design', kw: 'wilkinson divider combiner splitter unequal split quarter wave isolation resistor',
  desc: 'Equal or unequal two-way Wilkinson divider (Pozar §7.3). The split ratio is P3/P2 in dB; 0 dB is an equal split.',

// b4.js - phase 2, batch 4: mismatch uncertainty, terminated line, stub

// ---------------------------------------------------------- elliptic K ----
// K(k)/K(k') via the arithmetic-geometric mean: K(k) = π/(2·AGM(1, k')).
function b4Agm(a, b) {
  for (let i = 0; i < 60 && Math.abs(a - b) > 1e-15 * a; i++) { const t = (a + b) / 2; b = sqrt(a * b); a = t; }
  return (a + b) / 2;
}
// ratio K(k)/K(k'), with k' = √(1 − k²); kp may be passed for accuracy near k = 1
function b4KK(k, kp) {
  if (kp === undefined) kp = sqrt(Math.max(0, 1 - k * k));
  if (!(k > 0)) return 0;
  if (!(kp > 0)) return Infinity;
  return b4Agm(1, k) / b4Agm(1, kp);
}
// K(k)/K(k') from k and ln k' (k' may underflow for very wide strips):
// for k' → 0, K(k)/K(k') → (2/π)·ln(4/k').
function b4KKlog(k, lkp) {
  if (lkp < -600) return 2 / PI * (Math.log(4) - lkp);
  return b4KK(k, Math.exp(lkp));
}
// ln sinh x and ln cosh x for x > 0 without overflow or loss of precision
const b4Lsh = x => x + Math.log(-Math.expm1(-2 * x)) - Math.LN2;
const b4Lch = x => x + Math.log1p(Math.exp(-2 * x)) - Math.LN2;

// --------------------------------------------------- terminated line ------
// tan θ with θ in degrees, reduced modulo 180° first. Within rounding of a
// multiple of 180° it is exactly 0, so a λ/2 line repeats the load exactly
// (Math.tan(π) = −1.2e-16 would leave a spurious reactance).
function b4TanDeg(deg) {
  const r = deg - 180 * Math.round(deg / 180);
  if (Math.abs(r) <= 1e-13 * Math.max(180, Math.abs(deg))) return 0;
  return Math.tan(r * PI / 180);
}
// Lossless line: Zin = Z0·(ZL + jZ0·t)/(Z0 + jZL·t), t = tan θ
function b4Zin(z0, zl, deg) {
  const t = b4TanDeg(deg);
  if (t === 0) return cx(zl.re, zl.im);
  if (!isFinite(t) || Math.abs(t) > 1e15) return cdiv(cx(z0 * z0), zl);
  return cscale(cdiv(cadd(zl, cx(0, z0 * t)), cadd(cx(z0), cmul(cx(0, t), zl))), z0);
}
// inverse: the load that produces Zin
function b4ZlFromZin(z0, zin, deg) {
  const t = b4TanDeg(deg);
  if (t === 0) return cx(zin.re, zin.im);
  if (!isFinite(t) || Math.abs(t) > 1e15) return cdiv(cx(z0 * z0), zin);
  return cscale(cdiv(csub(zin, cx(0, z0 * t)), csub(cx(z0), cmul(cx(0, t), zin))), z0);
}

// ---------------------------------------------------- single stub ---------
// Stub matching of ZL to a line Z0 (Pozar 5.2), stub characteristic impedance zs.
// type: 'shunt-short' | 'shunt-open' | 'series-short' | 'series-open'.
// Returns up to two solutions: bd, bl = electrical distance / stub length (rad, 0..pi).
function b4StubMatch(z0, zl, zs, type) {
  const series = type.indexOf('series') === 0, open = type.slice(-4) === 'open';
  const zn = cscale(zl, 1 / z0);
  // Shunt: normalised load impedance w = zL, choose d so that Re(y_d) = 1.
  // Series: the dual problem, w = yL, choose d so that Re(z_d) = 1 (same formula).
  const w = series ? cinv(zn) : zn;
  const r = w.re, x = w.im;
  const ts = [];
  if (Math.abs(r - 1) < 1e-12) { ts.push(-x / 2); ts.push(Infinity); }
  else {
    const q = r * ((1 - r) * (1 - r) + x * x);
    if (!(q >= 0)) return [];
    // roots of (r−1)t² − 2xt + (r − r² − x²) = 0 without cancellation: the larger
    // one directly, the smaller one from the product t₁t₂ = (r² + x² − r)/(1 − r)
    const big = (x + (x < 0 ? -1 : 1) * sqrt(q)) / (r - 1);
    const small = big === 0 ? 0 : (r * r + x * x - r) / ((1 - r) * big);
    ts.push(x < 0 ? small : big);
    ts.push(x < 0 ? big : small);
  }
  const sols = [];
  for (let t of ts) {
    // a load already on the g = 1 (r = 1) circle needs d = 0: snap the rounding
    // residue so it cannot show up as 3e-17 λ or wrap round to λ/2
    if (isFinite(t) && Math.abs(t) < 1e-12) t = 0;
    let bd = isFinite(t) ? Math.atan(t) : PI / 2;
    if (bd < 0) bd += PI;
    // w moves along the line the same way for z and y: w_d = (w + jt)/(1 + jwt)
    const wd = isFinite(t) ? cdiv(cadd(w, cx(0, t)), cadd(CONE, cmul(cx(0, t), w))) : cinv(w);
    const dual = cinv(wd);          // = 1 + j*im (normalised y_d for shunt, z_d for series)
    const im = dual.im;
    let arg;                        // required tan(bl) so that the stub cancels j*im
    if (!series) arg = open ? -im * zs / z0 : z0 / (im * zs);
    else arg = open ? zs / (im * z0) : -im * z0 / zs;
    let bl = isFinite(arg) ? Math.atan(arg) : PI / 2;
    if (bl < -1e-15) bl += PI;
    if (Math.abs(bl) < 1e-15) bl = 0;
    // verify with physical impedances
    const zd = cscale(series ? dual : wd, z0);   // impedance looking into the line at d
    let zin;
    if (!series) {
      const ystub = open ? cx(0, Math.tan(bl) / zs) : cx(0, -1 / (zs * Math.tan(bl)));
      zin = cinv(cadd(cinv(zd), ystub));
    } else {
      const zstub = open ? cx(0, -zs / Math.tan(bl)) : cx(0, zs * Math.tan(bl));
      zin = cadd(zd, zstub);
    }
    sols.push({ bd: bd, bl: bl, im: im, gd: zToGamma(zd, z0), gres: cabs(zToGamma(zin, z0)),
      stub: series ? -im * z0 : -im / z0 });   // stub reactance (ohm) or susceptance (S)
  }
  return sols;
}

// ---------------------------------------------------------- stripline -----
// Symmetric stripline, Wheeler (1978) with strip thickness (Wadell §3.5.1).
// W strip width, b ground-plane spacing, t strip thickness.
function b4Stripline(W, b, t, er) {
  t = t > 0 ? t : 0;
  if (!(W > 0 && b > t)) return NaN;
  const x = t / b;
  let Wp = W;
  if (x > 0) {
    const m = 2 / (1 + (2 / 3) * x / (1 - x));
    const dW = (b - t) * (x / (PI * (1 - x))) * (1 - 0.5 * Math.log(Math.pow(x / (2 - x), 2) + Math.pow(0.0796 * x / (W / b + 1.1 * x), m)));
    Wp = W + dW;

  const n = (b - t) / Wp;
  const a = (8 / PI) * n;
  return ETA0 / (4 * PI * sqrt(er)) * Math.log(1 + (4 / PI) * n * (a + sqrt(a * a + 6.27)));

// exact zero-thickness stripline (Cohn): Z0 = (η0/4√εr)·K(k)/K(k'), k = sech(πW/2b)
function b4StriplineCohn(W, b, er) {
  const u = PI * W / (2 * b);
  return ETA0 / (4 * sqrt(er)) * b4KK(1 / Math.cosh(u), Math.tanh(u));
}

// ----------------------------------------------------------- CPW ----------
// Conformal mapping, zero-thickness conductors, infinitely wide side grounds
// (Simons, "Coplanar Waveguide Circuits, Components and Systems", §2.2 / §2.4).
// W centre strip width, s slot width, h substrate thickness.
// The complementary moduli are evaluated in closed form, so that wide strips
// (k → 1) neither lose precision in √(1 − k²) nor overflow sinh:
//   k₀′ = 2√(s(W+s))/(W+2s), k₁′ = √(sinh(b−a)·sinh(b+a))/sinh b,
//   k₃′ = √(sinh(b−a)·sinh(b+a))/(cosh a·sinh b), a = πW/4h, b = π(W+2s)/4h.
const b4K0 = (W, s) => b4KK(W / (W + 2 * s), 2 * sqrt(s * (W + s)) / (W + 2 * s));
function b4Cpw(W, s, h, er) {
  const a = PI * W / (4 * h), b = PI * (W + 2 * s) / (4 * h);
  const k1 = Math.exp(b4Lsh(a) - b4Lsh(b));

  const r1 = b4KKlog(k1, 0.5 * (b4Lsh(b - a) + b4Lsh(b + a)) - b4Lsh(b));

// conductor-backed (grounded) CPW: ground plane at distance h below
function b4Gcpw(W, s, h, er) {
  const a = PI * W / (4 * h), b = PI * (W + 2 * s) / (4 * h);
  const k3 = Math.tanh(a) / Math.tanh(b);

  const r3 = b4KKlog(k3, 0.5 * (b4Lsh(b - a) + b4Lsh(b + a)) - b4Lch(a) - b4Lsh(b));
  const q = r3 / r0;
  const ee = (1 + er * q) / (1 + q);
  return { z0: 60 * PI / sqrt(ee) / (r0 + r3), ee: ee };

// ------------------------------------------------- coupled microstrip -----
// Edge-coupled microstrip, static even/odd mode values, Kirschning & Jansen

// ============================================================================

const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  for (let i = 2; i < arguments.length; i++) {
    for (const c of [].concat(arguments[i])) {
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
  }
  return e;
}
let vizUid = 0;

// ---------------------------------------------------------------- tooltip --
// One shared tooltip. rows: [{ value, label, slot }] - value leads, label follows.
const vizTip = {
  el: null,
  show(target, rows, ev) {
    if (!this.el) { this.el = h('div', { class: 'viz-tip', role: 'tooltip' }); document.body.append(this.el); }
    this.el.replaceChildren(...rows.map(r => h('div', { class: 'viz-tip-row' },
      r.slot ? h('span', { class: 'viz-key', style: 'background: var(--series-' + r.slot + ')' }) : null,
      h('strong', {}, r.value), h('span', { class: 'viz-tip-label' }, r.label || ''))));
    this.el.style.display = 'block';
    let x, y;
    if (ev && ev.clientX !== undefined) { x = ev.clientX + 14; y = ev.clientY + 14; }
    else { const b = target.getBoundingClientRect(); x = b.right + 8; y = b.top; }
    const w = this.el.offsetWidth, hgt = this.el.offsetHeight;
    if (x + w > innerWidth - 8) x = Math.max(8, x - w - 28);
    if (y + hgt > innerHeight - 8) y = Math.max(8, y - hgt - 28);
    this.el.style.left = x + 'px';
    this.el.style.top = y + 'px';
  },
  hide() { if (this.el) this.el.style.display = 'none'; },
};
function tipOn(el, rows) {
  el.setAttribute('tabindex', '0');
  el.classList.add('viz-hit');
  el.addEventListener('pointermove', ev => vizTip.show(el, rows, ev));
  el.addEventListener('pointerleave', () => vizTip.hide());
  el.addEventListener('focus', () => vizTip.show(el, rows));
  el.addEventListener('blur', () => vizTip.hide());
  return el;
}

}

}

// Labels of points closer than `px` are merged so they never stack on each other.
function mergeLabels(pts, px) {
  const groups = [];
  for (const p of pts) {
    const g = groups.find(g => Math.hypot(g.x - p.x, g.y - p.y) < px);
    if (g) g.names.push(p.label); else groups.push({ x: p.x, y: p.y, names: [p.label] });
  }
  return groups;
}
function pointLabels(svg, pts, cx, cy) {
  for (const g of mergeLabels(pts, 10)) {
    // push the label outward from the centre so it clears the marker
    const dx = g.x - cx, dy = g.y - cy, d = Math.hypot(dx, dy);
    const ux = d > 1 ? dx / d : 0.7, uy = d > 1 ? dy / d : -0.7;
    const tx = g.x + ux * 11, ty = g.y + uy * 11 + 4;
    svg.append(sv('text', { x: tx, y: ty, class: 'viz-dlabel', 'text-anchor': ux < -0.3 ? 'end' : ux > 0.3 ? 'start' : 'middle' }, g.names.join(', ')));
  }
}
function marker(svg, x, y, slot, rows) {
  svg.append(sv('circle', { cx: x, cy: y, r: 5, class: 'viz-dot', style: 'fill: var(--series-' + slot + ')' }));
  svg.append(tipOn(sv('circle', { cx: x, cy: y, r: 12, class: 'viz-hitarea' }), rows));
}
// Off-scale point: hollow ring at the clamped position plus a small arrow pointing
// out of the plot (dx, dy: -1, 0 or 1 in screen directions).
function offMarker(svg, x, y, dx, dy, slot, rows) {
  svg.append(sv('circle', { cx: x, cy: y, r: 5, class: 'viz-dot off', style: 'stroke: var(--series-' + slot + ')' }));
  const n = Math.hypot(dx, dy), ux = dx / n, uy = dy / n, tx = x + ux * 15, ty = y + uy * 15, bx = x + ux * 8, by = y + uy * 8;
  svg.append(sv('path', { class: 'viz-offarrow', style: 'fill: var(--series-' + slot + ')',
    d: 'M' + tx.toFixed(2) + ' ' + ty.toFixed(2) + 'L' + (bx - uy * 4).toFixed(2) + ' ' + (by + ux * 4).toFixed(2) +
       'L' + (bx + uy * 4).toFixed(2) + ' ' + (by - ux * 4).toFixed(2) + 'Z' }));
  svg.append(tipOn(sv('circle', { cx: x, cy: y, r: 12, class: 'viz-hitarea' }), rows));
}

// ------------------------------------------------------ power stacked bar --
// segments: [{ label, pct, slot, s }] - where the incident power goes.
function powerBar(title, segments) {
  const shown = segments.filter(s => isFinite(s.pct));
  if (shown.length !== segments.length) return null;
  const negative = shown.some(s => s.pct < -1e-9 && !s.allowNeg);

        sv('text', { x: x + cell / 2, y: y + cell / 2 - 2, class: 'heat-t h' + k, 'text-anchor': 'middle' }, name),
        sv('text', { x: x + cell / 2, y: y + cell / 2 + 13, class: 'heat-t heat-v h' + k, 'text-anchor': 'middle' }, isFinite(d) ? fmt(d, 3) : '−∞'));
