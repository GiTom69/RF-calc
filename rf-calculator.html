const b2PnDefault = [
  { f: '1k', L: '-85' }, { f: '10k', L: '-95' }, { f: '100k', L: '-100' }, { f: '1M', L: '-120' }, { f: '10M', L: '-145' },
];
CUSTOM.pnjitter = function (calc, body) {
  calc.wide = true;
  const saved = store.get('c.pnjitter');
  let rows = Array.isArray(saved) && saved.length ? saved : b2PnDefault.map(r => Object.assign({}, r));
  const upd = () => update();
  const f0 = numField('Carrier frequency', 1e9, { unit: 'Hz', du: 'MHz' }, upd);
  const f1 = numField('Integrate from offset', 1e3, { unit: 'Hz', du: 'kHz' }, upd);
  const f2 = numField('Integrate to offset', 10e6, { unit: 'Hz', du: 'MHz' }, upd);
  const tbl = h('div');
  const out = h('div', { class: 'sout' });
  const chartBox = h('div');
  const mem = cardMemory('c.pnjitter.f', { nums: { f0: f0, f1: f1, f2: f2 } });
  const parseRow = r => [parseField(r.f, 'Hz', 'Hz', 'Hz').val, parseNum(String(r.L).replace(/dBc\/Hz$/i, ''))];

  function drawTable() {
    tbl.innerHTML = '';
    const t = h('table', { class: 'grid edit b2-pn' });
    t.append(h('thead', {}, h('tr', {}, h('th', {}, '#'), h('th', {}, 'Offset (Hz, e.g. 10k)'), h('th', {}, 'L(f) (dBc/Hz)'), h('th', {}, ''))));
    const tb = h('tbody');
    rows.forEach((r, i) => {
      const a = h('input', { type: 'text', value: r.f, spellcheck: 'false' });
      const b = h('input', { type: 'text', value: r.L, spellcheck: 'false' });
      a.addEventListener('input', () => { r.f = a.value; update(); });
      b.addEventListener('input', () => { r.L = b.value; update(); });
      const del = h('button', { class: 'btn small', title: 'Remove point' }, '×');
      del.addEventListener('click', () => { rows.splice(i, 1); drawTable(); update(); });
      tb.append(h('tr', {}, h('td', {}, String(i + 1)), h('td', {}, a), h('td', {}, b), h('td', {}, del)));
    });
    t.append(tb);
    const add = h('button', { class: 'btn' }, '+ Add point');
    add.addEventListener('click', () => {
      const last = rows.length ? parseRow(rows[rows.length - 1]) : [1e3, -100];
      rows.push({ f: fmtSI(isFinite(last[0]) ? last[0] * 10 : 1e3, '').replace(/\s/g, ''), L: String(isFinite(last[1]) ? last[1] - 20 : -100) });
      drawTable(); update();
    });
    tbl.append(t, h('div', { class: 'btnrow' }, add));
  }
  function update() {
    store.set('c.pnjitter', rows);
    mem.save();
    out.innerHTML = '';
    chartBox.innerHTML = '';
    const pts = rows.map(parseRow);
    const bad = pts.findIndex(p => !(p[0] > 0) || !isFinite(p[1]));
    if (bad >= 0) { out.append(h('div', { class: 'msg err' }, 'Point ' + (bad + 1) + ': enter a positive offset and a level in dBc/Hz.')); return; }
    if (pts.length < 2) { out.append(h('div', { class: 'msg info' }, 'Enter at least two points.')); return; }
    const F0 = f0.get(), A = f1.get(), B = f2.get();
    if (!(F0 > 0 && A > 0 && B > A)) { out.append(h('div', { class: 'msg err' }, 'Enter a carrier frequency and integration limits with "from" < "to".')); return; }
    const I = b2PnIntegrate(pts, A, B);
    if (!(I.p > 0)) { out.append(h('div', { class: 'msg err' }, 'The integration range does not overlap the table.')); return; }
    const r = b2PnResults(I.p, F0);
    out.append(kvTable([
      ['Integrated SSB phase noise 10·log ∫L(f)df', fmt(r.ssb, 5) + ' dBc'],
      ['Integrated DSB phase noise (both sidebands)', fmt(r.dsb, 5) + ' dBc'],
      ['RMS phase error', fmt(r.phiRad * 1e3, 5) + ' mrad = ' + fmt(r.phiDeg, 5) + '°'],
      ['RMS jitter', fmtSI(r.jitter, 's', 5)],
      ['EVM limit, small-angle ≈ φ<sub>rms</sub> (phase noise only)', fmt(r.evm, 4) + ' %'],
      ['EVM limit, Gaussian phase error √(2(1 − e<sup>−φ²/2</sup>))', fmt(r.evmGauss, 4) + ' %'],
      ['SNR limit (phase noise only)', fmt(r.snr, 5) + ' dB'],
      ['Integrated range', b2Hz(I.lo) + ' … ' + b2Hz(I.hi)],
    ]));
    if (r.large) out.append(h('div', { class: 'msg warn b2-large' }, '⚠ φrms = ' + fmt(r.phiRad, 3) + ' rad is large (> 0.2 rad). The small-angle relations L(f) ≈ Sφ(f)/2, EVM ≈ φrms and SNR = −10·log(2∫L) are no longer accurate; the Gaussian EVM (at most 141 %) is the better estimate.'));
    if (I.clipped) out.append(h('div', { class: 'msg warn' }, '⚠ The integration limits extend beyond the table. Only ' + b2Hz(I.lo) + ' … ' + b2Hz(I.hi) + ' is integrated. Add points to cover the full range.'));
    const sp = pts.slice().sort((a, b) => a[0] - b[0]);
    const lx = sp.map(p => log10(p[0]));
    const Ls = sp.map(p => p[1]);
    const ymin = Math.floor((Math.min(...Ls) - 5) / 10) * 10, ymax = Math.ceil((Math.max(...Ls) + 5) / 10) * 10;
    chartBox.append(b2Wrap(lineChart({
      title: 'Single-sideband phase noise L(f)',
      w: 560, h: 260,
      x: { min: lx[0], max: lx[lx.length - 1], label: 'Offset frequency (log scale)', fmt: t => fmtSI(Math.pow(10, t), 'Hz', 3) },
      y: { min: ymin, max: ymax, label: 'dBc/Hz' },
      series: [{ label: 'L(f)', slot: 1, pts: sp.map(p => [log10(p[0]), p[1]]) }],
      legend: [],
      markers: sp.map(p => ({ x: log10(p[0]), y: p[1], slot: 1, rows: [{ value: fmt(p[1], 4) + ' dBc/Hz', label: 'at ' + b2Hz(p[0]), slot: 1 }] })),
      vlines: [{ x: log10(I.lo), label: 'from' }, { x: log10(I.hi), label: 'to' }],
      tip: x => {
        // 10^x can land a hair outside the table at the axis ends
        const f = Math.min(sp[sp.length - 1][0], Math.max(sp[0][0], Math.pow(10, x)));
        return [{ value: fmt(b2PnAt(sp, f), 4) + ' dBc/Hz', label: 'at ' + b2Hz(f), slot: 1 }];
      },
    })));
  }
  mem.restore();
  resetButton(body, () => { rows = b2PnDefault.map(r => Object.assign({}, r)); mem.reset(); drawTable(); update(); });
  body.append(
    h('p', { class: 'desc' }, 'Integrates a single-sideband phase-noise profile between two offsets and gives RMS phase error, jitter and the resulting EVM and SNR limits. Between points the curve is straight on a log-log plot, and each segment is integrated exactly.'),
    h('div', { class: 'cols' }, h('div', {}, f0.row, f1.row, f2.row, tbl), h('div', {}, out)),
    chartBox,
    h('div', { class: 'note', html: 'φ<sub>rms</sub> = √(2∫L(f)df) rad (L in linear units, single sideband) · jitter = φ<sub>rms</sub>/(2π·f₀) · EVM ≈ φ<sub>rms</sub> · SNR limit = −10·log(2∫L(f)df). A segment with slope s dB/decade integrates as a power law f<sup>s/10</sup>; −10 dB/decade uses the logarithmic form.' }));
  drawTable();
  update();
};

// ------------------------------------------------------- spur table -------
CUSTOM.spurs = function (calc, body) {
  calc.wide = true;
  const upd = () => update();
  const rf1 = numField('RF band start', 2400e6, { unit: 'Hz', du: 'MHz' }, upd);
  const rf2 = numField('RF band stop', 2483.5e6, { unit: 'Hz', du: 'MHz' }, upd);
  const loMode = selectField('LO', [['fixed', 'Fixed frequency'], ['band', 'Tuning range']], 'fixed', () => { vis(); update(); });
  const lo1 = numField('LO frequency (or range start)', 2330e6, { unit: 'Hz', du: 'MHz' }, upd);
  const lo2 = numField('LO range stop', 2413.5e6, { unit: 'Hz', du: 'MHz' }, upd);
  lo2.row.style.display = 'none';
  const if1 = numField('IF band start', 70e6, { unit: 'Hz', du: 'MHz' }, upd);
  const if2 = numField('IF band stop', 153.5e6, { unit: 'Hz', du: 'MHz' }, upd);
  const nmax = numField('Maximum order |m| + |n|', 5, { sym: '' }, upd);
  const want = selectField('Wanted product', [['down', '|RF − LO| (down-conversion)'], ['up', 'RF + LO (up-conversion)']], 'down', upd);
  const show = selectField('Show', [['in', 'Products in the IF band only'], ['all', 'All products']], 'in', upd);
  const out = h('div', { class: 'sout' });
  const mem = cardMemory('c.spurs', { nums: { rf1: rf1, rf2: rf2, lo1: lo1, lo2: lo2, if1: if1, if2: if2, nmax: nmax }, sels: { loMode: loMode, want: want, show: show } });
  const vis = () => { lo2.row.style.display = loMode.get() === 'band' ? '' : 'none'; };
  function update() {
    mem.save();
    out.innerHTML = '';
    const R1 = rf1.get(), R2 = rf2.get(), L1 = lo1.get(), L2 = loMode.get() === 'band' ? lo2.get() : lo1.get();
    const I1 = if1.get(), I2 = if2.get(), N = Math.round(nmax.get());
    if (![R1, R2, L1, L2, I1, I2].every(x => x >= 0) || !(R2 >= R1 && L2 >= L1 && I2 >= I1)) {
      out.append(h('div', { class: 'msg err' }, 'Enter non-negative band edges with start ≤ stop.')); return;
    }
    // the wanted RF ± LO is itself an order-2 product
    if (!(N >= 2 && N <= 15)) { out.append(h('div', { class: 'msg err' }, 'The order must be between 2 and 15 (the wanted product RF ± LO is order 2).')); return; }
    const rows = b2Products({ rf1: R1, rf2: R2, lo1: L1, lo2: L2, if1: I1, if2: I2, N: N, desired: want.get() });
    const spurs = rows.filter(r => r.inband && r.kind !== 'desired');
    const lowest = spurs.length ? Math.min(...spurs.map(r => r.order)) : NaN;
    const des = rows.find(r => r.kind === 'desired');
    if (!des) { out.append(h('div', { class: 'msg err' }, 'The wanted product was not generated; increase the maximum order.')); return; }
    // share of the wanted range inside the IF band (r.overlap is a share of the IF band instead)
    const desSpan = des.f2 - des.f1;
    const desIn = desSpan > 0 ? Math.max(0, Math.min(des.f2, I2) - Math.max(des.f1, I1)) / desSpan : (des.inband ? 1 : 0);
    const desPart = des.inband && (des.f1 < I1 || des.f2 > I2);
    const desWarn = !des.inband ? '  ⚠ not inside the IF band'
      : desPart ? '  ⚠ only partly inside the IF band (' + fmt(100 * desIn, 3) + ' % of the wanted range' +
        (L2 > L1 ? '; RF and LO are treated as independent, so a tracking LO may stay in band' : '') + ')' : '';
    out.append(kvTable([
      ['Wanted product', des.text + ' = ' + b2Hz(des.f1) + ' … ' + b2Hz(des.f2) + desWarn],
      ['Unwanted products in the IF band', spurs.length ? String(spurs.length) : 'none up to order ' + N],
      ['Lowest-order in-band spur', isFinite(lowest) ? 'order ' + lowest + ': ' + spurs.filter(r => r.order === lowest).map(r => r.text).join(', ') : '—'],
    ]));
    const list = show.get() === 'all' ? rows : rows.filter(r => r.inband);
    out.append(section('Mixing products m·RF ± n·LO', b2Table(['m', 'n', 'Order', 'Product', 'Frequency range', 'In IF band', 'Type'],
      list.map(r => [r.m, r.n, r.order, r.text, b2Hz(r.f1) + ' … ' + b2Hz(r.f2),
        r.inband ? (r.kind === 'desired' ? (desPart ? 'wanted (' + fmt(100 * desIn, 3) + ' % in IF)' : 'wanted') : '<b>yes</b> (' + fmt(100 * r.overlap, 3) + ' % of IF)') : 'no', r.kind]),
      i => list[i].kind === 'desired' ? 'b2-want' : list[i].inband ? 'b2-hit' : '')));
    const inB = (a, b, c, d) => !(b < c || a > d);
    const harm = [];
    for (let k = 2; k <= N; k++) {
      const hr = [k * R1, k * R2], hl = [k * L1, k * L2];
      harm.push([k, b2Hz(hr[0]) + ' … ' + b2Hz(hr[1]), inB(hr[0], hr[1], I1, I2) ? '<b>IF band</b>' : '—',
        b2Hz(hl[0]) + (L2 > L1 ? ' … ' + b2Hz(hl[1]) : ''), inB(hl[0], hl[1], I1, I2) ? '<b>IF band</b>' : inB(hl[0], hl[1], R1, R2) ? '<b>RF band</b>' : '—']);
    }
    if (harm.length) out.append(section('Harmonics', b2Table(['k', 'k·RF', 'Falls in', 'k·LO', 'Falls in'], harm)));
  }
  body.append(
    h('p', { class: 'desc' }, 'Lists every mixing product |m·RF ± n·LO| up to a maximum order and flags the ones that land in the IF band. With an LO tuning range, RF and LO are treated as varying independently, which is conservative for a tracking LO.'),
    h('div', { class: 'cols' }, h('div', {}, rf1.row, rf2.row, loMode.row, lo1.row, lo2.row), h('div', {}, if1.row, if2.row, nmax.row, want.row, show.row)),
    out,
    h('div', { class: 'note', html: 'Order = |m| + |n|. Low-order products (2·RF − 2·LO, 2·LO − RF, …) are usually the strongest; their levels depend on the mixer, so check them against the mixer’s spur table.' }));
  mem.restore();
  resetButton(body, () => { mem.reset(); vis(); update(); });
  vis();
  update();
};

// ------------------------------------------------------ LC filter card ----
CUSTOM.lcfilter = function (calc, body) {
  calc.wide = true;
  const upd = () => update();
  const resp = selectField('Response', [['butter', 'Butterworth (maximally flat)'], ['cheby', 'Chebyshev (equal ripple)']], 'butter', () => { vis(); update(); });
  const ripple = numField('Pass-band ripple', 0.5, { sym: 'dB' }, upd);
  const type = selectField('Filter type', [['lpf', 'Low-pass'], ['hpf', 'High-pass'], ['bpf', 'Band-pass'], ['bsf', 'Band-stop']], 'lpf', () => { vis(); update(); });
  const fc = numField('Cut-off frequency f<sub>c</sub>', 2e9, { unit: 'Hz', du: 'MHz' }, upd);
  const f0 = numField('Centre frequency f₀ (geometric)', 1e9, { unit: 'Hz', du: 'MHz' }, upd);
  const bw = numField('Bandwidth (pass band for BPF, stop band for BSF)', 100e6, { unit: 'Hz', du: 'MHz' }, upd);
  const omode = selectField('Order', [['fixed', 'Choose the order'], ['spec', 'From a stop-band requirement']], 'spec', () => { vis(); update(); });
  const nfield = numField('Order N', 5, { sym: '' }, upd);
  const fst = numField('Stop-band frequency', 3e9, { unit: 'Hz', du: 'MHz' }, upd);
  const ast = numField('Required attenuation at that frequency', 15, { sym: 'dB' }, upd);
  const z0 = numField('System impedance Z₀', 50, { unit: 'ohm', du: 'Ω' }, upd);
  const first = selectField('First element', [['shunt', 'Shunt (π ladder)'], ['series', 'Series (T ladder)']], 'shunt', upd);
  const snap = selectField('Component values', [['exact', 'Exact'], ['E96', 'Nearest E96'], ['E24', 'Nearest E24'], ['E12', 'Nearest E12']], 'exact', upd);
  const out = h('div', { class: 'sout' });
  const chartBox = h('div');
  const mem = cardMemory('c.lcfilter', {
    nums: { ripple: ripple, fc: fc, f0: f0, bw: bw, nfield: nfield, fst: fst, ast: ast, z0: z0 },
    sels: { resp: resp, type: type, omode: omode, first: first, snap: snap },
  });
  function vis() {
    const band = type.get() === 'bpf' || type.get() === 'bsf';
    ripple.row.style.display = resp.get() === 'cheby' ? '' : 'none';
    fc.row.style.display = band ? 'none' : '';
    f0.row.style.display = band ? '' : 'none';
    bw.row.style.display = band ? '' : 'none';
    nfield.row.style.display = omode.get() === 'fixed' ? '' : 'none';
    fst.row.style.display = omode.get() === 'spec' ? '' : 'none';
    ast.row.style.display = omode.get() === 'spec' ? '' : 'none';
  }
  const partTxt = e => {
    const L = e.L !== undefined ? fmtSI(e.L, 'H', 4) : '', C = e.C !== undefined ? fmtSI(e.C, 'F', 4) : '';
    if (e.net === 'L') return 'L = ' + L;
    if (e.net === 'C') return 'C = ' + C;
    return 'L = ' + L + ', C = ' + C;
  };
  const netTxt = e => e.net === 'L' ? 'inductor' : e.net === 'C' ? 'capacitor' : e.net === 'LCs' ? 'series LC' : 'parallel LC';
  function update() {
    mem.save();
    out.innerHTML = '';
    chartBox.innerHTML = '';
    const R = resp.get(), T = type.get(), Z = z0.get(), rip = R === 'cheby' ? ripple.get() : 0;
    const band = T === 'bpf' || T === 'bsf';
    const FC = fc.get(), F0 = f0.get(), BW = bw.get();
    const err = m => out.append(h('div', { class: 'msg err' }, m));
    if (!(Z > 0)) return err('Enter a positive impedance.');
    if (R === 'cheby' && !(rip > 0 && rip <= 10)) return err('Enter a ripple between 0 and 10 dB.');
    // the lumped band transforms are exact for any fractional bandwidth
    if (band ? !(F0 > 0 && BW > 0) : !(FC > 0)) return err('Enter positive frequencies.');
    let N, Om = NaN;
    if (omode.get() === 'spec') {
      Om = b2FilterOmega(T, fst.get(), FC, F0, BW);
      if (!(Om > 1)) return err('The stop-band frequency must lie in the stop band (outside the pass band).');
      N = b2FilterOrder(R, ast.get(), rip, Om);
      if (!(N >= 1)) return err('Enter a positive attenuation.');
      if (N > 20) return err('This needs order ' + N + '. The limit is 20; relax the requirement.');
    } else {
      N = Math.round(nfield.get());
      if (!(N >= 1 && N <= 20)) return err('The order must be between 1 and 20.');
    }
    const design = b2FilterDesign({ resp: R, ripple: rip, type: T, n: N, fc: FC, f0: F0, bw: BW, z0: Z, first: first.get() });
    const built = b2FilterSnap(design, snap.get());
    const snapped = snap.get() !== 'exact';
    const w3 = b2Filter3dB(R, N, rip);
    const edges = band ? b2BandEdges(F0, BW) : null;
    let f3 = '';
    if (T === 'lpf') f3 = b2Hz(FC * w3);
    else if (T === 'hpf') f3 = b2Hz(FC / w3);
    else if (T === 'bpf') f3 = b2Hz(b2BandEdges(F0, BW * w3)[0]) + ' … ' + b2Hz(b2BandEdges(F0, BW * w3)[1]);
    else f3 = b2Hz(b2BandEdges(F0, BW / w3)[0]) + ' … ' + b2Hz(b2BandEdges(F0, BW / w3)[1]);
    const rows = [
      ['Order N', String(N) + (omode.get() === 'spec' ? ' (minimum for ' + fmt(ast.get(), 4) + ' dB at Ω = ' + fmt(Om, 4) + ')' : '')],
      ['Prototype g-values g₁ … g<sub>N</sub>', design.g.slice(1, N + 1).map(x => fmt(x, 5)).join(', ')],
      ['Load g<sub>N+1</sub> → required load resistance', fmt(design.g[N + 1], 5) + ' → ' + fmtSI(design.rl, 'Ω', 5) +
        (Math.abs(design.rl - Z) > 1e-6 * Z ? ' ⚠ not Z₀ (even-order Chebyshev): use a transformer, or choose an odd order' : '')],
      band ? ['Pass-band edges (ripple / −3 dB for Butterworth)', b2Hz(edges[0]) + ' … ' + b2Hz(edges[1])] : null,
      [R === 'cheby' ? '−3 dB frequency' + (w3 < 1 ? ' (inside the ripple band, ripple > 3.01 dB)' : '') : 'Cut-off (−3 dB)', f3],
    ];
    if (omode.get() === 'spec') {
      const a1 = -b2FilterResp(design, fst.get()).s21, a2 = -b2FilterResp(built, fst.get()).s21;
      rows.push(['Attenuation at ' + b2Hz(fst.get()), fmt(a1, 4) + ' dB' + (snapped ? ' (with ' + snap.get() + ' values: ' + fmt(a2, 4) + ' dB)' : '')]);
    }
    out.append(kvTable(rows));
    if (band && BW > F0) out.append(h('div', { class: 'msg info b2-wide' }, 'Very wide band (f₂/f₁ = ' + fmt(edges[1] / edges[0], 3) + '): the component values spread a lot. A cascaded low-pass and high-pass may be more practical.'));
    out.append(section('Components (source → load)', b2Table(['#', 'Position', 'Network', 'Exact values', snapped ? snap.get() + ' values' : ''],
      design.els.map((e, i) => [e.k, e.arm === 'series' ? 'series arm' : 'shunt to ground', netTxt(e), partTxt(e), snapped ? partTxt(built.els[i]) : '']))));
    // response chart
    let xmin, xmax;
    if (T === 'lpf') { xmin = 0; xmax = 3 * FC; }
    else if (T === 'hpf') { xmin = 0; xmax = 3 * FC; }
    else { xmin = Math.max(0, F0 - 3 * BW); xmax = F0 + 3 * BW; }
    if (omode.get() === 'spec' && fst.get() > xmax * 0.95) xmax = fst.get() * 1.15;
    if (omode.get() === 'spec' && fst.get() < xmin + 0.05 * (xmax - xmin)) xmin = Math.max(0, fst.get() * 0.85);
    const NP = 400, pts21 = [], pts11 = [], ptsB = [];
    for (let i = 0; i <= NP; i++) {
      const f = xmin + (xmax - xmin) * i / NP || (xmax - xmin) / (NP * 50);
      const r = b2FilterResp(design, f);
      pts21.push([f, r.s21]); pts11.push([f, r.s11]);
      if (snapped) ptsB.push([f, b2FilterResp(built, f).s21]);
    }
    const series = [{ label: '|S21| exact', slot: 1, pts: pts21 }, { label: '|S11| exact', slot: 2, pts: pts11 }];
    if (snapped) series.push({ label: '|S21| with ' + snap.get() + ' values', slot: 3, pts: ptsB });
    const vl = band ? [{ x: edges[0] }, { x: edges[1] }] : [{ x: FC, label: 'f_c' }];
    if (omode.get() === 'spec') vl.push({ x: fst.get(), label: 'stop' });
    chartBox.append(b2Wrap(lineChart({
      title: 'Response of the ladder (with the designed terminations)',
      w: 640, h: 280,
      x: { min: xmin, max: xmax, label: 'Frequency', fmt: v => fmtSI(v, 'Hz', 3) },
      y: { min: -80, max: 2, label: 'dB' },
      series: series,
      vlines: vl,
      tip: f => {
        const r = b2FilterResp(design, Math.max(f, (xmax - xmin) / (NP * 50)));
        const t = [{ value: b2Hz(f), label: 'frequency' }, { value: fmt(r.s21, 4) + ' dB', label: '|S21|', slot: 1 }, { value: fmt(r.s11, 4) + ' dB', label: '|S11|', slot: 2 }];
        if (snapped) t.push({ value: fmt(b2FilterResp(built, Math.max(f, (xmax - xmin) / (NP * 50))).s21, 4) + ' dB', label: '|S21| ' + snap.get(), slot: 3 });
        return t;
      },
      note: 'Computed from the actual LC ladder (ABCD cascade), lossless components.',
    })));
  }
  mem.restore();
  resetButton(body, () => { mem.reset(); vis(); update(); });
  vis();
  body.append(
    h('p', { class: 'desc' }, 'Lumped LC ladder from the Butterworth or Chebyshev low-pass prototype, transformed to low-, high-, band-pass or band-stop. The order can come from a stop-band requirement. Values can be snapped to standard series, and the response of the real ladder is plotted.'),
    h('div', { class: 'cols' },
      h('div', {}, resp.row, ripple.row, type.row, fc.row, f0.row, bw.row, z0.row),
      h('div', {}, omode.row, nfield.row, fst.row, ast.row, first.row, snap.row)),
    out, chartBox,
    h('div', { class: 'note', html: 'Butterworth g<sub>k</sub> = 2·sin((2k−1)π/2N). Chebyshev g-values from β = ln coth(L<sub>r</sub>/17.37), γ = sinh(β/2N) (Matthaei, Pozar §8.3). Even-order Chebyshev filters need a load of g<sub>N+1</sub>·Z₀ (or Z₀/g<sub>N+1</sub>). Band-pass: series arm L = g·Z₀/(ω₀Δ), C = Δ/(ω₀gZ₀); shunt arm L = ΔZ₀/(ω₀g), C = g/(ω₀ΔZ₀), with Δ = BW/f₀.' }));
  update();
};

// b3-ui.js - phase 2, batch 3: custom cards (2-port cascade, Pi/T match) and
// the two-ray loss chart. DOM code only; the maths lives in b3.js.

// ---------------------------------------------------------- two-ray chart ---
function b3TwoRayChart(v) {
  if (![v.f, v.ht, v.hr, v.d].every(x => isFinite(x) && x > 0)) return null;
  const dc = b3Crossover(v.f, v.ht, v.hr);
  // the x-range always contains the marked distance, also below 1 m
  const d0 = Math.max(1, Math.min(v.d, dc) / 100);
  const lo = log10(v.d < d0 ? v.d / 2 : d0), hi = log10(Math.max(v.d, dc) * 10);
  // the plane-earth asymptote is only meaningful from around the crossover outwards;
  // with the plane-earth model selected it is drawn down to the marked distance
  const peFrom = v.$.model === 'plane' ? Math.min(dc / 4, v.d) : dc / 4;
  const fs = [], pe = [], ex = [];
  let ymin = Infinity, ymax = -Infinity;
  for (let i = 0; i <= 240; i++) {
    const x = lo + (hi - lo) * i / 240, d = Math.pow(10, x);
    const a = fsplDb(v.f, d), b = b3PlaneEarth(d, v.ht, v.hr), c = b3TwoRayExact(v.f, d, v.ht, v.hr);
    const showPe = d >= peFrom;
    fs.push([x, a]);
    pe.push([x, showPe ? b : NaN]);
    ex.push([x, c]);
    ymin = Math.min(ymin, a, showPe ? b : Infinity);
    ymax = Math.max(ymax, a, showPe ? b : -Infinity);
  }
  // ... and the y-range contains the marked loss
  if (isFinite(v.L)) { ymin = Math.min(ymin, v.L); ymax = Math.max(ymax, v.L); }
  const yl = Math.floor(ymin / 10) * 10 - 10, yh = Math.ceil(ymax / 10) * 10 + 10;
  const slot = v.$.model === 'exact' ? 3 : (v.$.model === 'plane' || v.d >= dc) ? 2 : 1;
  return lineChart({
    title: 'Path loss vs. distance',
    w: 560, h: 270,
    x: { min: lo, max: hi, label: 'Distance (log scale)', fmt: t => fmtSI(Math.pow(10, t), 'm', 2) },
    y: { min: yl, max: yh, label: 'Path loss (dB)', fmt: t => fmt(t, 4) },
    series: [
      { label: 'Free space (20 dB/decade)', pts: fs, slot: 1 },
      { label: 'Plane earth (40 dB/decade)', pts: pe, slot: 2 },
      { label: 'Exact two-ray (Γ = −1)', pts: ex, slot: 3 },
    ],
    markers: isFinite(v.L) ? [{ x: log10(v.d), y: v.L, label: fmt(v.L, 4) + ' dB', slot: slot,
      rows: [{ value: fmt(v.L, 5) + ' dB', label: 'path loss at ' + fmtSI(v.d, 'm', 4), slot: slot }] }] : [],
    vlines: [{ x: log10(dc), label: 'crossover ' + fmtSI(dc, 'm', 3) }],
    tip: x => {
      const d = Math.pow(10, x);
      return [
        { value: fmtSI(d, 'm', 4), label: 'distance' },
        { value: fmt(fsplDb(v.f, d), 4) + ' dB', label: 'free space', slot: 1 },
        { value: d >= peFrom ? fmt(b3PlaneEarth(d, v.ht, v.hr), 4) + ' dB' : '—', label: 'plane earth', slot: 2 },
        { value: fmt(b3TwoRayExact(v.f, d, v.ht, v.hr), 4) + ' dB', label: 'exact two-ray', slot: 3 },
      ];
    },
    note: 'The values at the marked distance are in the fields and results above.',
  });
}

// ------------------------------------------------------ 2-port cascade card ---
const B3_CASC_PRESETS = [
  ['bw3', 'Butterworth low-pass, 3rd order, fc = 1 GHz', 1e9, [
    { type: 'sl', v: { L: '7.9577n' } }, { type: 'shc', v: { C: '6.3662p' } }, { type: 'sl', v: { L: '7.9577n' } }]],
  ['pad10', '10 dB Pi attenuator from resistors', 1e9, [
    { type: 'shr', v: { R: '96.25' } }, { type: 'sr', v: { R: '71.15' } }, { type: 'shr', v: { R: '96.25' } }]],
  ['chain', 'Amplifier → 3 dB pad → 50 Ω line (180°)', 1e9, [
    { type: 'amp', v: { g: '20', iso: '40' } }, { type: 'att', v: { a: '3' } }, { type: 'line', v: { zc: '50', deg: '180', loss: '0.5' } }]],
  // optional 5th element: other fields the example sets
  ['qwt', 'λ/4 line, 70.7 Ω: 100 Ω load → 50 Ω (Z₀′ = 100 Ω)', 1e9, [
    { type: 'line', v: { zc: '70.71', deg: '90', loss: '0' } }], { z0b: 100 }],
];
// floating-point residue shown as exact 0 (also turns −0 into +0, so a negative real angle reads 180°,
// not −180°). The reflections S11, S22 come from a cancellation and are cleaned relative to the largest
// entry; a transmission only loses a Re or Im part negligible next to its own magnitude, so a real
// −260 dB isolation is kept.
const b3Tidy = (z, scale) => { const t = 1e-12 * scale; return cx((Math.abs(z.re) <= t ? 0 : z.re) + 0, (Math.abs(z.im) <= t ? 0 : z.im) + 0); };
// reflection residue of a matched chain is ~1e-16 absolute whatever the chain loss, so the
// diagonal threshold has an absolute floor of 1e-14 (−280 dB); transmissions are only cleaned
// relative to their own size
const b3TidyM = M => { const s = mMaxAbs(M); return M.map((r, i) => r.map((z, j) => b3Tidy(z, i === j ? Math.max(s, 0.01) : cabs(z)))); };
const b3BlockDefaults = type => {
  const o = {};
  for (const [k, , d] of B3_BLOCKS[type].p) o[k] = d;
  return o;
};
const b3Clone = x => JSON.parse(JSON.stringify(x));

CUSTOM.cascade2p = function (calc, body) {
  calc.wide = true;
  const saved = store.get('c.cascade2p') || {};
  let blocks = Array.isArray(saved.blocks) && saved.blocks.length && saved.blocks.every(b => B3_BLOCKS[b.type]) ? saved.blocks : b3Clone(B3_CASC_PRESETS[0][3]);
  const upd = () => update();
  const f = numField('Frequency', isFinite(saved.f) ? saved.f : 1e9, { unit: 'Hz', du: 'GHz' }, upd);
  const z0 = numField('Reference impedance Z₀', isFinite(saved.z0) ? saved.z0 : 50, { unit: 'ohm', du: 'Ω' }, upd);
  const z0b = numField('Renormalise to Z₀′', isFinite(saved.z0b) ? saved.z0b : 75, { unit: 'ohm', du: 'Ω' }, upd);
  const preset = selectField('Load example', [['', 'Custom']].concat(B3_CASC_PRESETS.map(p => [p[0], p[1]])),
    saved.preset !== undefined ? saved.preset : 'bw3', () => {
      const p = B3_CASC_PRESETS.find(x => x[0] === preset.get());
      if (!p) return;
      blocks = b3Clone(p[3]);
      f.set(p[2]);
      if (p[4] && p[4].z0b) z0b.set(p[4].z0b);
      drawTable();
      update();
    });
  const tbl = h('div');
  const out = h('div', { class: 'sout' });
  const edited = () => { preset.sel.value = ''; };

  function drawTable() {
    tbl.innerHTML = '';
    const t = h('table', { class: 'grid edit b3-blocks' });
    t.append(h('thead', {}, h('tr', {}, h('th', {}, '#'), h('th', {}, 'Block (port 1 → port 2)'), h('th', {}, 'Parameters'), h('th', {}, ''))));
    const tb = h('tbody');
    blocks.forEach((b, i) => {
      const typeSel = h('select', { class: 'b3-type' }, Object.keys(B3_BLOCKS).map(k => h('option', { value: k }, B3_BLOCKS[k].name)));
      typeSel.value = b.type;
      typeSel.addEventListener('change', () => { b.type = typeSel.value; b.v = b3BlockDefaults(b.type); edited(); drawTable(); update(); });
      const params = h('div', { class: 'b3-params' });
      for (const [k, label, d, unit] of B3_BLOCKS[b.type].p) {
        if (b.v[k] === undefined) b.v[k] = d;
        const inp = h('input', { type: 'text', value: b.v[k], spellcheck: 'false', autocomplete: 'off', 'aria-label': label });
        inp.addEventListener('input', () => {
          b.v[k] = inp.value;
          inp.classList.toggle('bad', isNaN(parseNum(inp.value)));
          edited();
          update();
        });
        params.append(h('label', { class: 'b3-param' }, h('span', { class: 'b3-plabel' }, label), inp, h('span', { class: 'b3-punit' }, unit)));
      }
      const upb = h('button', { class: 'btn small', title: 'Move up' }, '↑');
      upb.addEventListener('click', () => { if (i > 0) { [blocks[i - 1], blocks[i]] = [blocks[i], blocks[i - 1]]; edited(); drawTable(); update(); } });
      const del = h('button', { class: 'btn small', title: 'Remove block' }, '×');
      del.addEventListener('click', () => { blocks.splice(i, 1); edited(); drawTable(); update(); });
      tb.append(h('tr', {}, h('td', {}, String(i + 1)), h('td', {}, typeSel), h('td', {}, params), h('td', { class: 'nowrap' }, upb, del)));
    });
    t.append(tb);
    const add = h('button', { class: 'btn' }, '+ Add block');
    add.addEventListener('click', () => { blocks.push({ type: 'sl', v: b3BlockDefaults('sl') }); edited(); drawTable(); update(); });
    tbl.append(t, h('div', { class: 'btnrow' }, add));
  }

  const sTable = S => gridTable(['', 'dB', '|S|', '∠ deg', 'Re', 'Im'],
    [['S11', 0, 0], ['S21', 1, 0], ['S12', 0, 1], ['S22', 1, 1]].map(([n, i, j]) => {
      const s = S[i][j];   // already tidied
      return [n, dB20(s), fmt(cabs(s), 5), fmt(cabs(s) === 0 ? 0 : cdeg(s), 5), fmt(s.re, 5), fmt(s.im, 5)];
    }));
  // return loss and VSWR of a reflection |Γ|; |Γ| > 1 (reflection gain) only occurs at active ports
  // (a total reflection |Γ| = 1 ± rounding reads exactly 0 dB / ∞ and is not called active)
  const rlTxt = g => {
    if (Math.abs(g - 1) <= 1e-12) g = 1;
    return fmt(-dbv(g), 5) + ' dB / ' + fmt(vswrOf(g), 5) + (g > 1 ? ' (|Γ| > 1, active)' : '');
  };
  const metrics = S => kvTable([
    ['Insertion gain |S21|²', dB20(S[1][0]) + ' dB'],
    ['Input return loss / VSWR', rlTxt(cabs(S[0][0]))],
    ['Output return loss / VSWR', rlTxt(cabs(S[1][1]))],
  ]);
  // input impedance with port 2 terminated in Zt: Zin = (A·Zt + B)/(C·Zt + D)
  const zinRows = (M, Zt, Zref) => {
    let zin = cdiv(cadd(cscale(M[0][0], Zt), M[0][1]), cadd(cscale(M[1][0], Zt), M[1][1]));
    zin = b3Tidy(zin, cabs(zin));
    const g = cabs(b3Tidy(cdiv(csub(zin, cx(Zref)), cadd(zin, cx(Zref))), 1));
    return kvTable([
      ['Z<sub>in</sub> at port 1, port 2 terminated in Z₀′', fmtC(zin, 5, 'Ω')],
      ['Its return loss / VSWR against Z₀ = ' + fmtSI(Zref, 'Ω', 4), rlTxt(g)],
    ]);
  };

  function update() {
    store.set('c.cascade2p', { f: f.get(), z0: z0.get(), z0b: z0b.get(), preset: preset.get(), blocks: blocks });
    out.innerHTML = '';
    const F = f.get(), Z0 = z0.get(), Zb = z0b.get();
    if (!(F > 0 && Z0 > 0 && Zb > 0)) { out.append(h('div', { class: 'msg err' }, 'Enter a positive frequency and reference impedances.')); return; }
    if (!blocks.length) { out.append(h('div', { class: 'msg info' }, 'Add a block.')); return; }
    const r = b3Cascade(blocks, F, Z0);
    if (r.err) { out.append(h('div', { class: 'msg err' }, r.err)); return; }
    const S = b3TidyM(r.S), Sb = b3TidyM(abcdToS(r.abcd, Zb, r.det));
    out.append(sChartsRow(S, [{ label: 'S21', z: S[1][0], slot: 1 }, { label: 'S12', z: S[0][1], slot: 2 }]));
    const send = h('button', { class: 'btn' }, 'Send result to the 2-port calculator');
    send.addEventListener('click', () => CUSTOM_API.s2 && CUSTOM_API.s2.load(S, Z0));
    out.append(h('div', { class: 'convs' },
      section('Cascade S-parameters at Z₀ = ' + fmtSI(Z0, 'Ω', 4), h('div', {}, sTable(S), metrics(S))),
      section('Renormalised to Z₀′ = ' + fmtSI(Zb, 'Ω', 4), h('div', {}, sTable(Sb), metrics(Sb), zinRows(r.abcd, Zb, Z0)))));
    out.append(h('div', { class: 'convs' },
      section('ABCD matrix (A, D: no unit · B: Ω · C: S)', matText(r.abcd)),
      section('Use the result', h('div', {}, h('p', { class: 'desc' }, 'Opens the full 2-port analysis (stability, gains, conversions) with this cascade.'), send))));
  }

  body.append(
    h('p', { class: 'desc' }, 'Chain two-port blocks from port 1 to port 2 and get the overall S-parameters. Blocks are combined as ABCD matrices, so the result can be re-expressed at any reference impedance Z₀′.'),
    h('div', { class: 'cols' }, h('div', {}, f.row, z0.row, z0b.row), h('div', {}, preset.row)),
    tbl, out,
    h('div', { class: 'note', html: 'Series Z: [[1, Z], [0, 1]] · shunt Y: [[1, 0], [Y, 1]] · line: [[cosh γℓ, Z<sub>c</sub>·sinh γℓ], [sinh γℓ/Z<sub>c</sub>, cosh γℓ]] · total = A₁·A₂·…·A<sub>n</sub>. S-parameter, attenuator and amplifier blocks are defined at Z₀ and need S21 ≠ 0 (isolators cannot be chained this way). The renormalised S-parameters use Z₀′ at both ports; Z<sub>in</sub> = (A·Z₀′ + B)/(C·Z₀′ + D) shows the network as a transformer from a Z₀′ load to Z₀.' }));
  resetButton(body, () => {
    const p = B3_CASC_PRESETS[0];
    blocks = b3Clone(p[3]);
    f.set(p[2]); z0.set(50); z0b.set(75);
    preset.sel.value = p[0];
    drawTable();
    update();
  });
  drawTable();
  update();
};

// ----------------------------------------------------------- Pi / T match card --
CUSTOM.pimatch = function (calc, body) {
  calc.wide = true;
  const upd = () => update();
  const f = numField('Frequency', 100e6, { unit: 'Hz', du: 'MHz' }, upd);
  const rs = numField('Source resistance R<sub>S</sub>', 50, { unit: 'ohm', du: 'Ω' }, upd);
  const rl = numField('Load resistance R<sub>L</sub>', 10, { unit: 'ohm', du: 'Ω' }, upd);
  const q = numField('Loaded Q', 5, { sym: '' }, upd);
  const out = h('div', { class: 'sout' });
  const topos = [['pi-lp', 'Pi, low-pass (C – L – C)'], ['pi-hp', 'Pi, high-pass (L – C – L)'], ['t-lp', 'T, low-pass (L – C – L)'], ['t-hp', 'T, high-pass (C – L – C)']];
  const elTxt = (e, F) => {
    const unit = e.kind === 'L' ? 'H' : 'F';
    const n = nearestE(e.val, 'E24');
    return e.role + '<br><b>' + e.kind + ' = ' + fmtSI(e.val, unit, 4) + '</b><br><span class="muted">X = ' + fmt(e.X, 4) + ' Ω · E24 ' + (n ? fmtSI(n.best, unit, 3) : '—') + '</span>';
  };
  const mem = cardMemory('c.pimatch', { nums: { f: f, rs: rs, rl: rl, q: q } });
  mem.restore();
  resetButton(body, () => { mem.reset(); update(); });
  function update() {
    out.innerHTML = '';
    mem.save();
    const F = f.get(), Rs = rs.get(), RL = rl.get(), Q = q.get();
    if (!(F > 0 && Rs > 0 && RL > 0 && Q > 0)) { out.append(h('div', { class: 'msg err' }, 'Enter a positive frequency, resistances and Q.')); return; }
    const res = topos.map(([t, name]) => [name, b3PiT(t, Rs, RL, Q, F)]);
    const bad = res.find(x => x[1].err);
    if (bad) { out.append(h('div', { class: 'msg err' }, bad[1].err)); return; }
    out.append(gridTable(['Topology', 'Source side', 'Middle', 'Load side', 'Check'],
      res.map(([name, r]) => [name, elTxt(r.els[0], F), elTxt(r.els[1], F), elTxt(r.els[2], F),
        'Virtual R = ' + fmtSI(r.Rv, 'Ω', 4) + '<br><span class="muted">Z<sub>in</sub> = ' + fmtC(r.zin, 5, 'Ω') + '</span>'])));
    const Qmin = sqrt(Math.max(Rs, RL) / Math.min(Rs, RL) - 1);
    out.append(kvTable([
      ['Minimum Q for this resistance ratio (single L-section)', fmt(Qmin, 4)],
      ['Approximate 3 dB bandwidth f/Q', fmtSI(F / Q, 'Hz', 4)],
    ]));
  }
  body.append(
    h('p', { class: 'desc' }, 'Three-element match between two real resistances with a chosen loaded Q (higher Q gives a narrower bandwidth). Pi uses a virtual resistance below both terminations, T one above both.'),
    h('div', { class: 'cols' }, h('div', {}, f.row, rs.row, rl.row, q.row), h('div')),
    out,
    h('div', { class: 'note', html: 'Pi: R<sub>v</sub> = R<sub>high</sub>/(Q² + 1); each side is an L-section with Q<sub>i</sub> = √(R<sub>i</sub>/R<sub>v</sub> − 1), shunt X = R<sub>i</sub>/Q<sub>i</sub>, series X = Q<sub>i</sub>R<sub>v</sub>. T: R<sub>v</sub> = R<sub>low</sub>(Q² + 1), series X = Q<sub>i</sub>R<sub>i</sub>, shunt X = R<sub>v</sub>/Q<sub>i</sub> (the two shunt parts combine). Reactive source or load parts can be absorbed into the adjacent element.' }));
  update();
};

;

// b4-ui.js - phase 2, batch 4 cards: single-stub matching.
// ============================================================================

CUSTOM.stubmatch = function (calc, body) {
  const out = h('div', { class: 'sout' });
  const upd = () => b4StubUpdate();
  const z0 = numField('Line impedance Z₀', 50, { unit: 'ohm', du: 'Ω' }, upd);
  const rl = numField('Load resistance R<sub>L</sub>', 60, { unit: 'ohm', du: 'Ω' }, upd);
  const xl = numField('Load reactance X<sub>L</sub>', -80, { unit: 'ohm', du: 'Ω', blank: 0 }, upd);
  const f = numField('Frequency', 2e9, { unit: 'Hz', du: 'GHz' }, upd);
  const ee = numField('Effective permittivity ε<sub>eff</sub>', 1, { sym: '' }, upd);
  const zs = numField('Stub impedance Z₀,stub', 50, { unit: 'ohm', du: 'Ω' }, upd);
  const type = selectField('Stub type', [
    ['shunt-short', 'Shunt stub, short-circuited'], ['shunt-open', 'Shunt stub, open-circuited'],
    ['series-short', 'Series stub, short-circuited'], ['series-open', 'Series stub, open-circuited']], 'shunt-short', upd);
  const mem = cardMemory('c.stubmatch', { nums: { z0: z0, rl: rl, xl: xl, f: f, ee: ee, zs: zs }, sels: { type: type } });
  mem.restore();
  resetButton(body, () => { mem.reset(); b4StubUpdate(); });

  function b4StubUpdate() {
    out.innerHTML = '';
    mem.save();
    const Z0 = z0.get(), RL = rl.get(), XL = xl.get(), F = f.get(), EE = ee.get(), ZS = zs.get();
    if (!(Z0 > 0 && RL > 0 && F > 0 && EE >= 1 && ZS > 0) || isNaN(XL)) {
      out.append(h('div', { class: 'msg err' }, 'Enter a positive line impedance, load resistance, stub impedance and frequency, and an effective permittivity of at least 1.'));
      return;
    }
    const zl = cx(RL, XL);
    const sols = b4StubMatch(Z0, zl, ZS, type.get());
    const lam = C0 / (F * sqrt(EE));
    if (cabs(zToGamma(zl, Z0)) < 1e-9) out.append(h('div', { class: 'msg info' }, 'The load is already matched; no stub is needed.'));
    if (!sols.length) { out.append(h('div', { class: 'msg err' }, 'No solution found.')); return; }
    const series = type.get().indexOf('series') === 0;
    const len = b => fmt(b / (2 * PI), 4) + ' λ · ' + fmt(b * 180 / PI, 4) + '° · ' + fmtSI(b / (2 * PI) * lam, 'm', 4);
    const shortest = sols.reduce((bi, s, i) => (s.bd + s.bl < sols[bi].bd + sols[bi].bl ? i : bi), 0);
    out.append(gridTable(['#', 'Distance d from the load', 'Stub length ℓ', series ? 'Stub reactance' : 'Stub susceptance', 'Check |Γ| after match'],
      sols.map((s, i) => [String(i + 1) + (i === shortest ? ' <span class="muted">(shortest)</span>' : ''), len(s.bd), len(s.bl),
        series ? fmt(s.stub, 5) + ' Ω' : fmt(s.stub * 1e3, 5) + ' mS', fmt(s.gres < 1e-12 ? 0 : s.gres, 3)])));
    out.append(h('div', { class: 'viz-row' }, smithChart('Load and stub points on the Smith chart', [{ label: 'Load', z: zToGamma(zl, Z0), slot: 1 }]
      .concat(sols.map((s, i) => ({ label: 'At d' + (i + 1), z: s.gd, slot: i + 2 }))))));
    out.append(kvTable([
      ['Wavelength in the line', fmtSI(lam, 'm', 5)],
      ['Normalised load z<sub>L</sub>', fmtC(cscale(zl, 1 / Z0), 5)],
      // b4GammaMag is ≤ 1 for R ≥ 0 even after rounding, so a passive load is never tagged active
      ['Load |Γ| / VSWR', fmt(b4GammaMag(RL, XL, Z0), 5) + ' / ' + vswrTxt(b4GammaMag(RL, XL, Z0))],
    ]));
  }
  body.append(h('p', { class: 'desc' }, 'A stub of length ℓ placed a distance d from the load matches it to Z₀. Both solutions are listed. Any length can be increased by λ/2 without changing the match.'),
    z0.row, rl.row, xl.row, f.row, ee.row, zs.row, type.row, out,
    h('div', { class: 'note', html: 'Pozar §5.2. Shunt stub: choose d so that the line admittance becomes Y₀ + jB, then the stub supplies −jB (open: Y = jY<sub>s</sub>·tan βℓ, short: Y = −jY<sub>s</sub>·cot βℓ). Series stub: the dual, using Z₀ + jX and Z = −jZ<sub>s</sub>·cot βℓ (open) or jZ<sub>s</sub>·tan βℓ (short). Lossless lines, stub and line with the same ε<sub>eff</sub>.' }));
  b4StubUpdate();
};
